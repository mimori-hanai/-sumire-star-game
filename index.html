function pickEvent(pool){return pick(pool)}

function step(){if(!game||game.ended||game.pending)return;let s=game;if(s.phase<2){let phase=s.phase;if(phase===0){addEvent('宝塚音楽学校・予科','春。宝塚音楽学校に入学した。声楽、バレエ、日本舞踊、演劇などを学ぶ。');s.phase=1;return}if(phase===1){s.calendar=s.entry-1;addEvent('本科・文化祭','本科生として最後の一年を迎える。文化祭では同期たちと舞台の基礎を披露した。');s.phase=2;return}}
 if(s.phase===2){s.calendar=s.entry;s.year=1;s.troupe=pick(GROUPS);s.phase=3;s.part=0;feed('初舞台・組配属',`${s.term}期として初舞台を踏み、${s.troupe}へ配属された。初舞台演目・組の詳細はこの物語では架空。`);save();render();return}
 if(s.part===0){s.part++;let p=interactions(s.calendar)[0];addEvent(`研${s.year}・新年度`,`${s.calendar}年。${s.troupe}の研究科${s.year}年となった。${p?`同じ組には${p.name}（${pplTerm(p)}期）も在籍しているという設定。`: '稽古場では上級生と下級生がともに作品を作る。'}`);return}
 if(s.part===1){s.part++;let title=titleFor(s.calendar);s.performances.push({year:s.calendar,term:s.year,title,kind:'本公演',role:'組子・配役あり',troupe:s.troupe});let p=interactions(s.calendar)[0];addEvent('本公演の稽古と舞台',`架空演目『${title}』に出演。${p?`${p.name}も同じ組の舞台に立ち、稽古場で顔を合わせた。`: '舞台稽古と本番を経て経験を重ねた。'}`);improve('acting');improve('team');return}
 if(s.part===2){s.part++;if(s.year<=7){let rivals=interactions(s.calendar,true).filter(p=>pplTerm(p)!==s.term||Math.random()>.5);let opponent=rivals.length?pick(rivals.slice(0,5)):null;let title=titleFor(s.calendar);if(s.role==='男役'){
 let key=opponent?opponent.name:'別の若手生徒';let chance=.025+s.year*.012+s.flags.rookie*.012+(s.stats.aura+s.stats.acting-50)*.0004;addEvent('新人公演の配役発表',`『${title}』の新人公演。${key}と主演候補として比較され、最終的な配役を待つ。実際の決定理由を再現するものではない。`,'choice',[
 {label:'主演を目指し、稽古場で役を深く作り込む',text:`${key}と互いに稽古を重ね、選考の結果を待った。`,run:()=>rookieResult(title,key,chance+.065)},
 {label:'役の大小より、芝居とチームワークを重視する',text:`${key}を含む仲間と場面を磨いた。`,run:()=>rookieResult(title,key,chance-.022)}]);return
 }else{let male=opponent?opponent.name:'上級生';let rival=pick(['月乃さくら','風花はる','星宮こはる','雪城れい']);let chance=.032+s.year*.013+s.flags.rookie*.012;addEvent('新人公演ヒロインの配役',`『${title}』のヒロインを${rival}（架空の娘役）と競う。一方、男役の${male}とは相手役候補として芝居合わせを行う（架空の交流）。`,'choice',[
 {label:'台詞とデュエットを重点的に稽古する',text:`${rival}と役の表現を競い、${male}と芝居を合わせた。`,run:()=>rookieResult(title,rival,chance+.06)},
 {label:'与えられた役を第一に考えて協力する',text:`${rival}と互いの芝居を磨き合った。`,run:()=>rookieResult(title,rival,chance-.02)}]);return
 }}else{let list=['別箱公演のオーディション','役替わりの稽古','組の中心となる責任','全国ツアーの稽古','外箱公演の配役'];let name=pick(list);let p=interactions(s.calendar)[0];let opts=[{label:'主役級の芝居に挑戦する',text:`${p?p.name+'と':'仲間と'}場面を繰り返し稽古した。`,run:()=>boxResult(p,true)},{label:'アンサンブルの完成度を上げる',text:'チームの表現を支えながら、新しい経験を積んだ。',run:()=>boxResult(p,false)}];addEvent(name,`${s.troupe}では新たな公演の準備が始まった。${p?p.name+'と同じ舞台に挑む（架空の共演）。':'下級生たちと稽古を重ねる。'}`,'choice',opts);return}}
 if(s.part===3){s.part++;let p=interactions(s.calendar)[0];let choices=yearChoices();addEvent(choices.title,choices.body+(p?` 今回は${p.name}とも顔を合わせる（架空の交流）。`:''),'choice',choices.items);return}
 if(s.part===4){s.part++;let y=s.year;if(y>=3&&s.stats.pop>=12){let lvl=s.club.level;let min=y>=5?16:12;if(s.stats.pop>=min){let opts=[{label:lvl?'私設ファンクラブのお茶会を開く':'小規模なお茶飲み会を開く',text:'ファンと公演の感想を語り合うひとときを過ごした。',run:()=>{if(s.club.level===0&&s.stats.pop>=24)s.club.level=1;s.club.meet++;gain('pop',1);gain('energy',-2)}},{label:'稽古と休養を優先する',text:'次の舞台に向けて心身を整えた。',run:()=>gain('energy',4)}];addEvent('応援する人たちとの交流',lvl?'私設ファンクラブの会員による公演後の交流会が計画された。':'少しずつ応援するファンが増えてきた。','choice',opts);return}}
 let rare=[['舞台袖での小さなハプニング','衣装の小道具が外れかけたが、全員で落ち着いて本番を終えた。'],['劇場への通勤','梅雨の雨の中、劇場へ向かう。今日も客席から拍手が聞こえる。'],['同期と過ごす休日','同期と街で食事をし、普段は話せない稽古の悩みを分かち合った。'],['役替わりの知らせ','次の公演では新しい配役に挑むことになった。'],['稽古中の声の不調','喉の疲れを感じ、発声のペースを見直した。'],['観劇と刺激','他の組の舞台から演技の工夫を学んだ。'],['お礼状を受け取る','ファンから舞台の感想が届き、励みになった。']];let x=pick(rare);addEvent(x[0],x[1]);return}
 if(s.part===5){s.part++;if(false){let next=pick(GROUPS.filter(g=>g!==s.troupe));addEvent('組替えの発表',`${s.troupe}から${next}への組替えが発表された（架空の人事）。`);s.troupe=next;return}if(s.year>=7&&s.flags.rookie>0&&s.flags.bau>0&&s.stats.pop>38&&Math.random()<.07){s.flags.top=true;s.ended=true;addEvent('トップ就任の発表',`${s.troupe}の${s.role==='男役'?'トップスター':'トップ娘役'}に就任することになった（架空の人事）。`);return}addEvent('一年を振り返る',`研${s.year}の公演を終えた。舞台経験を重ねながら、次の年の配役を待つ。`);return}
 if(s.part>=6){extraYear();save();render();return}
}
function rookieResult(title,other,chance){let success=Math.random()<clamp(chance,0,.25);let role=game.role==='男役'?'主演':'ヒロイン';let result=success?`『${title}』新人公演の${role}に選ばれた。${other}とも舞台を作り上げた（架空の配役・共演）。`:`新人公演の${role}は${other}が務めることになった（架空の配役）。自分は別の役で舞台に立った。`;if(success){game.flags.rookie++;gain('pop',4);improve('acting',1);game.performances.push({year:game.calendar,term:game.year,title,kind:'新人公演',role,troupe:game.troupe})}else{game.performances.push({year:game.calendar,term:game.year,title,kind:'新人公演',role:'配役あり',troupe:game.troupe})}feed('新人公演の結果',result);save()}
function boxResult(p,aim){let chance=aim?.035:.008;chance+=game.flags.rookie*.018+game.flags.bau*.009;if(Math.random()<Math.min(.2,chance)){game.flags.bau++;gain('pop',5);feed('別箱公演の主演抜擢',`バウホール公演で${game.role==='男役'?'主演':'ヒロイン'}に抜擢された（架空）。${p?p.name+'と同じ作品に参加。':''}`);game.performances.push({year:game.calendar,title:titleFor(game.calendar)+'・別箱編',kind:'バウホール公演',role:game.role==='男役'?'主演':'ヒロイン',troupe:game.troupe})}else{improve(aim?'aura':'team');feed('別箱公演の経験','今回の主役級への抜擢はなかったが、舞台を支える立場で出演した。')};save()}
function yearChoices(){let y=game.year;let group=y<=2?0:y<=7?1:y<=12?2:3;const pools=[
 [{title:'初めての本公演',body:'客席へ声を届けるため、稽古の組み立て方を考える。',a:['先輩に歌の自主稽古を相談','基本のダンスを積み重ね'],stats:['song','dance']},{title:'初めてのラインダンス',body:'同期たちと呼吸を合わせる毎日が続く。',a:['体力づくりをする','動きの精度を上げる'],stats:['energy','dance']},{title:'組配属後の生活',body:'上級生への挨拶や新しい稽古場の流れに慣れていく。',a:['周囲との連携を大切にする','台本を読み込む'],stats:['team','acting']}],
 [{title:'新人公演のお稽古場',body:'本役の芝居を手本に、自分なりの解釈を探る。',a:['人物の心情を掘り下げる','歌と芝居を結びつける'],stats:['acting','song']},{title:'同期の抜擢',body:'同期の活躍を見て焦りが生まれた。',a:['努力の方向を見直す','仲間の舞台から学ぶ'],stats:['aura','team']},{title:'初めての小さな役',body:'本公演で初めて名前のある役を任された。',a:['台詞の間を練る','舞台上の立ち姿を磨く'],stats:['acting','aura']},{title:'歌劇誌の取材',body:'舞台での心掛けを短いコメントとして求められた。',a:['作品の魅力を丁寧に語る','同期や組への感謝を語る'],stats:['aura','team']}],
 [{title:'番手と役付き',body:'後輩の台頭もあり、次の公演では役付きをさらに競う。',a:['主演級を意識した役作り','座組の調和を重視'],stats:['acting','team']},{title:'バウ・東上を目指して',body:'限られた公演枠で重要な役をつかみたい。',a:['個性の出る表現を磨く','歌唱の課題に向き合う'],stats:['aura','song']},{title:'新人公演の後輩を支える',body:'学年の若い生徒が新人公演で注目され始めている。',a:['自分の経験を伝える','一緒に舞台稽古を重ねる'],stats:['team','acting']},{title:'全国ツアーの一座',body:'普段とは違う劇場で舞台に立つ準備が進む。',a:['体力を整える','発声を見直す'],stats:['energy','song']}],
 [{title:'上級生としての責任',body:'後輩をまとめつつ自分の表現を深める時期。',a:['組全体の完成度を優先','新境地の役に挑戦する'],stats:['team','acting']},{title:'新しい作品への挑戦',body:'作風の異なる作品の出演依頼が重なる。',a:['舞踊の表現を更新する','台本の細部を読み解く'],stats:['dance','acting']},{title:'公演期間と体調管理',body:'長い公演期間で疲労が蓄積してきた。',a:['休養をしっかり取る','身体のケアを学ぶ'],stats:['energy','team']},{title:'舞台人としての選択',body:'今後の活動を考える節目が訪れた。',a:['次の大役への可能性を探る','現在の役を丁寧に務める'],stats:['aura','acting']}]];
 let d=pick(pools[group]);return {title:d.title,body:d.body,items:d.a.map((a,i)=>({label:a,text:a+'ことを選んだ。小さな積み重ねが次の舞台につながる。',run:()=>{if(d.stats[i]==='energy')gain('energy',3);else improve(d.stats[i]);gain('energy',-1)}}))}}
function nextStep(){save();render();if(playing&&!game.pending&&!game.ended)schedule()}
function fastTick(){if(!game||game.ended)return;if(game.pending?.choices){stop();render();return}if(game.pending){applyEvent(true);return}step();save();render();if(playing&&!game?.pending?.choices)schedule()}
function schedule(){clearTimeout(timer);if(!playing)return;timer=setTimeout(fastTick,Math.max(200,1100/speed))}function stop(){playing=false;clearTimeout(timer)}function togglePlay(){playing=!playing;if(playing)schedule();render()}
function fmtProfile(){let s=game,info=[['芸名',s.name],['本名（架空）',s.real],['誕生日（架空）',s.birth],['音楽学校入学時の年齢',s.age+'歳'],['期',s.term+'期（'+s.entry+'年入団）'],['身長（架空）',s.height+'cm'],['出身地（架空）',s.region],['出身校（架空）',s.school],['音楽学校受験',s.attempt+'回目で合格'],['憧れの先輩（設定）',s.admire],['家族の職業（架空）',s.parentJob],['志望',s.role],['所属組',s.troupe]];return `<section class="panel profile"><h2>スター・プロフィール</h2><dl>${info.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><p class="note">本名・生年月日・家族の職業などは主人公の架空プロフィールです。実在の生徒の非公開個人情報は使用していません。</p></section>`}
function statsSmall(){return `<div class="statrow">${Object.entries(SKILLS).map(([k,l])=>`<div class="stat">${l}<b>${game.stats[k]}</b><div class="meter"><span style="width:${game.stats[k]}%"></span></div></div>`).join('')}</div>`}
function statsSide(){return `<aside class="side"><div class="statside panel"><div class="sidehead">${esc(game.name)} · ${esc(game.troupe)}</div><p class="mini">${game.term}期／${game.role}／研${game.year||'—'}</p>${Object.entries(SKILLS).map(([k,l])=>`<div class="statline"><span>${l}</span><div class="bar"><i style="width:${game.stats[k]}%"></i></div><b>${game.stats[k]}</b></div>`).join('')}<hr><div class="mini">新人公演${game.role==='男役'?'主演':'ヒロイン'}：${game.flags.rookie}回<br>バウホール主演級：${game.flags.bau}回<br>私設FC：${game.club.level?'発足':'未発足'}<br>お茶会・お茶飲み会：${game.club.meet}回</div><button class="btn smallbutton" onclick="tab='profile';render()">プロフィール</button></div></aside>`}
function journal(){let a=game.events.slice(-120).reverse();return `<section class="panel"><h2>人生の記録 <span style="font-size:11px;color:#728086">新しい順</span></h2>${game.pending?.choices?`<div class="notice"><b>${esc(game.pending.name)}</b><p>${esc(game.pending.text)}</p><div class="actions">${game.pending.choices.map((x,i)=>`<button onclick="processChoices(${i})">${esc(x.label)} →</button>`).join('')}</div></div>`:''}${a.length?a.map(x=>`<div class="event ${x.kind}"><time>${x.age}歳<br>${x.year}年</time><div><strong>${esc(x.name)}</strong><p>${esc(x.text)}</p><span class="details">${esc(x.phase)} ・ ${x.kind==='auto'?'自動イベント':'選択イベント'}</span></div></div>`).join(''):'<p class="muted">「次へ」で人生が進みます。イベントには自動で発生するものと、選択肢が表示されるものがあります。</p>'}</section>`}
function showWorks(){return `<section class="panel"><h2>出演演目・配役</h2><p class="note">下記の演目・役付きは物語上の創作です。実在の公演履歴ではありません。</p>${game.performances.slice().reverse().map(p=>`<div class="history"><b>${esc(p.year)}年 ${esc(p.troupe)} 『${esc(p.title)}』</b>${esc(p.kind)}／${esc(p.role)}</div>`).join('')||'<p class="muted">初舞台の後に記録されます。</p>'}</section>`}
function people(){let arr=REAL_PEOPLE.filter(x=>(x.kind==='現役'||x.kind==='娘役'));let real=game?.calendar||2026,term=game?.term||102;let fit=arr.filter(p=>pplTerm(p)<=108&&entryTerm(pplTerm(p))<=real&&p.group===game?.troupe);return `<section class="panel"><h2>関係者・同期・ライバル</h2><p class="note">登場する実在人物の氏名・期は提供された名簿に基づきます。主人公との交流、配役争い、会話、組内での出会いは架空であり、実在の本人の発言や実際の人事を意味しません。過去の所属や実際の退団年は簡略化しています。</p><h3>同じ組・この年までに入団した人物</h3>${fit.map(p=>`<div class="history"><b>${esc(p.name)}（${pplTerm(p)}期）</b>${esc(p.position)}<br>${esc(p.bio)}</div>`).join('')||'<p class="muted">現在の条件で該当する登録人物はいません。</p>'}<details><summary>登録された現役生徒一覧</summary>${GROUPS.map(g=>`<h3>${g}</h3>${arr.filter(p=>p.group===g).map(p=>`<span class="tag">${esc(p.name)} ${pplTerm(p)}期</span>`).join('')}`).join('')}</details><details><summary>OG（近年退団の元トップスター）</summary>${REAL_PEOPLE.filter(p=>p.kind==='OG').map(p=>`<div class="history"><b>${esc(p.name)}</b>${esc(p.bio)}</div>`).join('')}</details></section>`}
function gameScreen(){return `<div class="split"><div class="column"><section class="panel"><div class="topbar"><div><span class="age">${currentAge()}</span>歳 <small>${game.calendar}年 · ${game.term}期 · ${game.year?'研'+game.year:game.phase===0?'予科':game.phase===1?'本科':'初舞台準備'}</small></div><small>${esc(game.name)} ／ ${esc(game.troupe)}</small></div><div class="progress"><span style="width:${(Math.min(game.year,19)/19)*100}%"></span></div><div class="controls"><button class="${playing?'selected':''}" onclick="togglePlay()">${playing?'Ⅱ 停止':'▶ 自動'}</button>${[1,2,4,8,12].map(v=>`<button class="${speed===v?'selected':''}" onclick="speed=${v};if(playing)schedule();render()">${v}×</button>`).join('')}<button onclick="fastTick()" ${game.pending?.choices||game.ended?'disabled':''}>次へ »</button><button onclick="tab='profile';stop();render()">プロフィール</button></div><div class="stage"><span class="pixel">🏰</span><span class="pixel">🎭</span><span class="pixel">💃</span><span class="pixel">🎶</span><span class="pixel">🏰</span></div><div class="identity">${game.phase<3?`宝塚音楽学校 ${game.term}期。${game.name}は舞台人となるために学んでいる。`:`${game.troupe}・${game.role}・${game.term}期。${game.year}年目の舞台人生。人気 ${game.stats.pop}/100。`}<div class="muted">選択しなくても起こる出来事と、判断を求められる出来事が時系列で積み重なります。</div></div><div class="panel sticky">${statsSmall()}</div><div class="row" style="margin-bottom:12px"><button class="btn ${tab==='timeline'?'primary':''}" onclick="tab='timeline';render()">人生の記録</button><button class="btn ${tab==='works'?'primary':''}" onclick="tab='works';render()">出演作品</button><button class="btn ${tab==='people'?'primary':''}" onclick="tab='people';render()">関係者</button></div>${game.ended?`<div class="end"><h2>舞台人生の幕が下りた</h2><p>${game.flags.top?'トップ就任を果たしました。':'退団までの歩みを振り返りましょう。'}</p></div>`:''}${tab==='works'?showWorks():tab==='people'?people():journal()}<p class="note">本作は非公式の架空作品です。公開制度を参考にしていますが、配役・公演タイトル・共演・新人公演の結果は創作です。</p></section></div>${statsSide()}</div>`}
function profileScreen(){return `<div class="split"><div><section class="panel"><h2>最初のステータス</h2>${statsSmall()}<p class="muted">初期能力は控えめです。成長速度を抑え、舞台経験を通じて少しずつ伸びる設計です。</p></section>${fmtProfile()}<section class="panel"><h3>これからの人生</h3><p>宝塚音楽学校の予科・本科、初舞台、組配属、新人公演（研7まで）、別箱公演、私設ファンクラブ、お茶会、組替え、退団までを時系列で描きます。</p><p class="notice">期は95〜108期から無作為に決定します。同期・先輩・後輩は入団年を考慮して登場します。なお、同じ組という設定はゲーム内の架空の時系列であり、実際の組配属・共演を保証しません。</p><div class="row"><button class="btn primary" onclick="tab='timeline';render()">この人生を始める →</button><button class="btn" onclick="newGame()">プロフィールを再抽選</button></div></section></div>${statsSide()}</div>`}
function home(){return `<div class="panel hero"><div class="muted">TAKARAZUKA LIFE SIMULATOR</div><h1>すみれの軌跡</h1><p>95〜108期のいずれかに生まれ、音楽学校から舞台人生を進める。<br>配役・新人公演・組替え・私設ファンクラブ・退団まで。</p><p class="muted">時間が流れ、思いがけない出来事や選択が積み重なる人生シミュレーション。</p><div class="row" style="justify-content:center"><button class="btn pink" onclick="newGame()">新しい人生を始める</button>${saved()?'<button class="btn" onclick="continueGame()">前回の続きから</button>':''}</div><p class="note">非公式のファン制作・架空のシミュレーション。実在人物の会話・主人公との共演・配役の競争はフィクションです。</p></div><section class="panel"><h3>考証に用いた参考資料</h3><p class="mini"><a href="https://www.tms.ac.jp/guidance/admissions.html" target="_blank">宝塚音楽学校：募集要項</a>（予科・本科の2年制）<br><a href="https://faq.kageki.hankyu.co.jp/faq/show/44?category_id=7&site_domain=default" target="_blank">宝塚歌劇：新人公演の公式FAQ</a>（入団7年目まで）<br><a href="https://kageki.hankyu.co.jp/fun/debut8.html" target="_blank">公式・108期初舞台</a>（2022年）<br><a href="https://ameblo.jp/yozora-ni-sakuhana/entry-12960382801.html" target="_blank">ユーザー指定の登場人物名簿</a><br><a href="https://www.moon-light.ne.jp/termi-nology/meaning/ochakai.htm" target="_blank">お茶会の慣習について</a></p></section>`}
function continueGame(){let s=saved();if(s&&s.term&&s.events){game=s;tab='timeline';render()}else alert('続きのデータが見つかりません。')}
function render(){const el=document.getElementById('app');el.innerHTML=!game?home():tab==='profile'?profileScreen():gameScreen()}

const JPY=n=>Math.round(n||0).toLocaleString('ja-JP')+'円';
function ensureExtra(){if(!game)return;game.wallet??=0;game.totalEarned??=0;game.salary??=0;game.pet??=null;game.purchases??=[];game.friendship??={};game.rankHistory??=[];game.leadWorks??=[];game.lastSalaryYear??=0;game.historical??=[];game.stats??={};game.flags??={rookie:0,bau:0,tojo:0,top:false,rank:0};game.spendCount??=0;game.choiceSeen??=[];game.roleSwitchChecked??=false;}
function activeCandidates(){if(!game)return [];return REAL_PEOPLE.filter(p=>(p.kind==='現役'||p.kind==='娘役')&&pplTerm(p)<=111&&entryTerm(pplTerm(p))<=game.calendar && (game.calendar<=2026 || entryTerm(pplTerm(p))<=2026)).filter(p=>Math.abs(pplTerm(p)-game.term)<=3).filter(p=>game.role==='娘役'?p.kind==='娘役':p.kind!=='娘役');}
function relativeScore(p){let t=pplTerm(p),career=game.calendar-entryTerm(t)+1;let seniority=Math.max(0,career)*2, weight=(p.kind==='娘役'?p.credits.filter(c=>c.year<=game.calendar).length*9:0)+Number((p.bio.match(/主演：(\d+)回/)||[])[1]||0)*9+(p.bio.includes('バウ')?9:0)+(p.bio.includes('東上')?14:0);return seniority+weight+(game.calendar<2026?Math.max(0,(game.calendar-2015))*0.5:6)}
function myScore(){ensureExtra();return (game.parentBoost||0)*55+Math.max(0,game.year)*2+game.flags.rookie*15+game.flags.bau*20+game.flags.tojo*23+game.stats.pop*.65+game.stats.aura*.2;}
function rankInfo(){let peers=activeCandidates();let count=1+peers.length;let rank=1+peers.filter(p=>relativeScore(p)>myScore()).length;let inTroupe=peers.filter(p=>p.group===game.troupe);let localRank=1+inTroupe.filter(p=>relativeScore(p)>myScore()).length;let stage=game.role==='娘役'?(game.flags.top?'トップ娘役':game.flags.rookie>=1?'ヒロイン候補':'組内娘役'):(game.flags.top?'トップスター':game.flags.rank===2?'2番手格':game.flags.rank===3?'3番手格':game.flags.rank===4?'路線候補':'組内男役');return {rank,count,localRank,localCount:inTroupe.length+1,stage}}
function adjustRank(){ensureExtra();if(game.role==='男役'&&!game.flags.top){let score=myScore();game.flags.rank=score>157&&game.flags.bau>=1?2:score>115&&game.flags.rookie>=1?3:score>73&&game.flags.rookie>=1?4:0;}else if(game.flags.top){game.flags.rank=1}}
function chooseShow(){let entries=REAL_SHOWS.filter(x=>x.troupe===game.troupe&&x.year===game.calendar);if(entries.length)return {...entries[game.part%entries.length],forecast:false};if(game.calendar>2026)return {year:game.calendar,troupe:game.troupe,title:pick(['銀河の詩','月光のシルエット','蒼天の恋','星の旅人']),theatre:'宝塚大劇場',forecast:true};return {year:game.calendar,troupe:game.troupe,title:pick(['初舞台生口上・ラインダンス','祝祭の舞台']),theatre:'宝塚大劇場',forecast:true}}
function recordShow(kind='本公演',featured=false){ensureExtra();let show=chooseShow(),cast=VERIFIED_CAST[`${show.year}|${show.troupe}|${show.title}`];let assigned='アンサンブル／配役未特定';let title=show.title;if(featured)assigned=game.role==='男役'?'主演（ゲーム内配役）':'ヒロイン（ゲーム内配役）';else if(game.year>=5&&Math.random()<.28)assigned=game.role==='男役'?'重要な役（ゲーム内配役）':'役付き（ゲーム内配役）';let record={year:game.calendar,term:game.year,title,kind,role:assigned,troupe:game.troupe,theatre:show.theatre,forecast:show.forecast,cast:cast||null};game.performances.push(record);if(featured){record.partner=choosePartner();game.leadWorks.push(record)}return record;}
function bumpFriend(name,points=1){ensureExtra();if(!name||name==='別の若手生徒')return;game.friendship[name]=Math.min(100,(game.friendship[name]||0)+points);}
function eventFriend(){let a=REAL_PEOPLE.filter(p=>(p.kind==='現役'||p.kind==='娘役')&&p.group===game.troupe&&entryTerm(pplTerm(p))<=game.calendar&&pplTerm(p)<=game.term+2&&pplTerm(p)>=game.term-6);return a.length?pick(a):null;}
function payYear(){ensureExtra();if(game.year<=0||game.lastSalaryYear===game.calendar)return;let basic=FICT_SALARY[Math.min(game.year,12)]||6200000;let bonus=(game.flags.rank===2?1250000:game.flags.rank===3?650000:game.flags.top?4200000:0)+game.stats.pop*6000;game.salary=basic+bonus;game.wallet+=game.salary;game.totalEarned+=game.salary;game.lastSalaryYear=game.calendar;feed('年収と貯蓄',`${game.calendar}年の推定年収（ゲーム内設定）は${JPY(game.salary)}。貯蓄に加算された。`);}
function buy(item){ensureExtra();let name={dog:'犬',cat:'猫',bird:'小鳥',fish:'魚',clothes:'洋服',outing:'同期との外出',spa:'メンテナンス',lesson:'個人レッスン',fc:'お茶会の運営費'}[item],cost=MONEY_PRICES[item];if(!name)return;if((item==='dog'||item==='cat'||item==='bird'||item==='fish')&&game.pet){alert('ペットはすでに飼っています。');return}if(game.wallet<cost){alert('貯蓄が不足しています。');return}game.wallet-=cost;game.spendCount++;game.purchases.push({year:game.calendar,item:name,cost});if(['dog','cat','bird','fish'].includes(item)){game.pet={kind:item,name:prompt('ペットの名前を入力してください','すみれ')||'すみれ'};gain('energy',1)}if(item==='clothes'){improve('aura',1)}if(item==='outing'){let p=eventFriend();if(p){bumpFriend(p.name,7);feed('同期・仲間と外出',`${p.name}と食事や買い物に出かけ、親交が深まった。`)}improve('team',1)}if(item==='spa')gain('energy',4);if(item==='lesson')improve(pick(['song','dance','acting']),2);if(item==='fc'){game.club.level=1;game.club.meet++;gain('pop',1)}feed('プライベートの支出',`${name}に${JPY(cost)}を使った。現在の貯蓄は${JPY(game.wallet)}。`);save();render()}
function salaryPanel(){ensureExtra();return `<div class="moneyband"><span>年収 <b>${JPY(game.salary)}</b></span><span>貯蓄 <b>${JPY(game.wallet)}</b></span><span>${esc(rankInfo().stage)}</span></div>`}
function pixelArt(){ensureExtra();const rank=rankInfo();const pet=game.pet?{dog:'🐕',cat:'🐈',bird:'🐦',fish:'🐠'}[game.pet.kind]:'';return `<div class="pixel-stage"><div class="curtain"></div><div class="curtain right"></div><div class="caption">${esc(game.troupe)}　${esc(rank.stage)}　${game.year?'研'+game.year:'音楽学校'}</div>${game.flags.rank<=2&&game.flags.rank>0||game.flags.top?'<div class="wings">♛ ✧</div>':''}<div class="character"><div class="head"></div><div class="dress" style="background:${game.role==='男役'?'#a2b4ce':'#efd2e8'}"></div></div>${pet?`<div class="pet">${pet}</div>`:''}</div>`}

function revisedPeople(){ensureExtra();let peers=activeCandidates().sort((a,b)=>Math.abs(pplTerm(a)-game.term)-Math.abs(pplTerm(b)-game.term));let r=rankInfo();let heroines=HEROINE_DATA.filter(p=>entryTerm(p.term)<=game.calendar && Math.abs(p.term-game.term)<=6).sort((a,b)=>a.term-b.term);return `<section class="panel"><h2>関係者・仲良し・序列比較</h2><div class="mini-rank">近い期（±3期）の比較：<b>${r.rank}位 / ${r.count}人</b><br>所属組内での比較：<b>${r.localRank}位 / ${r.localCount}人</b><br>現在の立ち位置：<b>${r.stage}</b><br><small>同じ男役・娘役の近い期を対象にしたゲーム内評価値の参考順位です。</small></div><h3>同時代の関係者</h3>${peers.map(p=>{let points=game.friendship[p.name]||0;let works=p.kind==='娘役'?p.credits.filter(c=>c.year<=game.calendar):REAL_SHOWS.filter(x=>x.troupe===p.group&&x.year<=game.calendar).slice(-2);return `<div class="history"><b>${esc(p.name)}（${pplTerm(p)}期／${p.group}・${p.kind==='娘役'?'娘役':'男役'}）</b><span class="pill">仲良し ${points}/100</span><div class="muted">${p.kind==='娘役'?'新人公演ヒロイン：':'出演公演の参考：'}${works.length?works.map(w=>`${w.year}『${esc(w.title)}』`).join('／'):'該当年までの主演記録なし'}</div></div>`}).join('')||'<p class="muted">現在の年代に登録人物がいません。</p>'}<details><summary>新人公演ヒロイン経験者一覧（${HEROINE_DATA.length}名）</summary>${GROUPS.map(g=>`<h3>${g}</h3>${HEROINE_DATA.filter(p=>p.group===g).map(p=>`<div class="history"><b>${esc(p.name)}・${p.term}期</b><br><small>${p.credits.map(c=>`${c.year}『${esc(c.title)}』`).join('／')}</small></div>`).join('')}`).join('')}</details><details><summary>男役・新人公演主演経験者一覧</summary>${GROUPS.map(g=>`<h3>${g}</h3>${REAL_PEOPLE.filter(p=>p.group===g&&p.kind==='現役').map(p=>`<span class="tag">${esc(p.name)}・${pplTerm(p)}期</span>`).join('')}`).join('')}</details><details><summary>近年退団した元トップスター</summary>${REAL_PEOPLE.filter(p=>p.kind==='OG').map(p=>`<div class="history">${esc(p.name)} ／ ${esc(p.bio)}</div>`).join('')}</details></section>`}
function revisedWorks(){ensureExtra();return `<section class="panel"><h2>自分の主演作品</h2>${game.leadWorks.length?game.leadWorks.slice().reverse().map(w=>`<div class="history"><b>${w.year}年 『${esc(w.title)}』</b>${esc(w.kind)} ／ ${esc(w.role)}<br>相手役：${esc(w.partner||'未記録')}</div>`).join(''):'<p class="muted">まだ主演作はありません。</p>'}<h2 style="margin-top:18px">出演演目・配役の記録</h2><div class="workslist">${game.performances.slice().reverse().map(w=>`<div class="history"><b>${esc(w.year)}年・${esc(w.troupe)} 『${esc(w.title)}』${w.forecast?'〈予想〉':''}</b>${esc(w.kind)} ／ ${esc(w.role)}${w.theatre?` ／ ${esc(w.theatre)}`:''}${w.cast?`<details><summary>実際の主な配役を見る</summary>${w.cast.main.map(c=>`<div>${esc(c[0])}：${esc(c[1])}</div>`).join('')}<b>新人公演</b>${w.cast.rookie.map(c=>`<div>${esc(c[0])}：${esc(c[1])}</div>`).join('')}</details>`:''}</div>`).join('')||'<p class="muted">公演の記録はこれから増えます。</p>'}</div><p class="note">作品名は公演資料に基づくものを収録。主人公の役はゲーム上の配役です。確認できた実際の主な配役は詳細欄に分離して表示しています。</p></section>`}

function stagePeriod(year){return year<=2?'1-2':year<=5?'3-5':year<=7?'6-7':year<=12?'8-12':'13-19'}
function chooseCareerEvent(){ensureExtra();game.choiceSeen??=[];let period=stagePeriod(game.year),pool=CAREER_CHOICE_EVENTS.filter(x=>x.period===period);let recent=new Set(game.choiceSeen.slice(-Math.min(14,pool.length-2)));let options=pool.filter(x=>!recent.has(x.title));let event=pick(options.length?options:pool);game.choiceSeen.push(event.title);return event}
const CAREER_ACTIONS={song:['声楽レッスンを増やし、歌で応える','歌唱の録音を聴き直して研究する'],dance:['振付を繰り返し自主練習する','同期に相談して動きを揃える'],acting:['台本を読み直して役を深める','相手と芝居合わせを重ねる'],aura:['舞台上の見せ方を工夫する','衣装や表情を研究する'],team:['仲間と話し合って支える','周囲への気配りを優先する'],energy:['休養と身体のケアを優先する','無理をしない稽古計画にする'],pop:['取材や写真撮影に取り組む','ファンとの交流を丁寧に続ける']};
function stageCareerChoice(){let e=chooseCareerEvent(),person=eventFriend(),who=person?.name||'稽古仲間';let a=CAREER_ACTIONS[e.a],b=CAREER_ACTIONS[e.b];stagedChoice(e.title,`${e.situation}。${who}とも話しながら、どう行動するか。`,[{label:a[game.events.length%a.length],effect:e.a,friend:person?.name},{label:b[(game.events.length+1)%b.length],effect:e.b,friend:person?.name}]);}
function maybeRoleSwitch(){ensureExtra();if(game.role!=='男役'||game.height>170||game.year!==3||game.roleSwitchChecked)return false;game.roleSwitchChecked=true; // 条件該当者に対してキャリア中一度だけ20%抽選
if(Math.random()>=.20)return false;stagedChoice('男役から娘役への転向を考える',`身長${game.height}cm。これまでの男役での経験を生かしつつ、娘役への転向という選択肢が示された。`,[{label:'娘役へ転向し、新しい役の可能性を探る',effect:'switchToMusume'},{label:'男役として舞台を極める',effect:'stayOtoko'}]);return true;}
function choosePartner(){let opposite=game.role==='男役'?'娘役':'現役';let people=REAL_PEOPLE.filter(p=>p.kind===opposite&&p.group===game.troupe&&entryTerm(pplTerm(p))<=game.calendar&&Math.abs(pplTerm(p)-game.term)<=8);if(!people.length)return '同じ組の相手役候補';return pick(people).name;}
function runGameChoice(ix){if(!game.pending||!game.pending.choices)return;let c=game.pending.choices[ix];if(!c)return;let evt=game.pending;game.pending=null;let mode=c.effect||'acting';if(mode==='switchToMusume'){game.role='娘役';game.flags.rookie=0;game.flags.rank=0;addAuto('娘役への転向',`男役としての経験を生かし、娘役として舞台に立つことを決めた。`,'acting');feed(evt.name,c.label,'choice');save();render();return}else if(mode==='stayOtoko'){feed(evt.name,'男役として歩み続ける道を選んだ。','choice');save();render();return}if(mode==='rookie'){const guy=c.rival||'別の候補';let chance=.018+(game.parentBoost||0)+game.year*.016+game.flags.rookie*.025+game.stats.aura*.0005+(ix===0?.035:0);let ok=Math.random()<Math.min(.20,chance);if(ok){game.flags.rookie++;gain('pop',3);improve('acting');let r=recordShow('新人公演',true);feed('新人公演主演・ヒロイン',`『${r.title}』の新人公演${game.role==='男役'?'主演':'ヒロイン'}に抜擢された。相手役は${r.partner}。`)}else{let w=recordShow('新人公演');feed('新人公演配役',`『${w.title}』の新人公演は${guy}の抜擢が話題に。自分は${w.role}で出演した。`)}bumpFriend(guy,2)}else if(mode==='bau'){let ok=Math.random()<Math.min(.28,.025+(game.parentBoost||0)+game.flags.rookie*.055+game.stats.pop*.002);if(ok){game.flags.bau++;gain('pop',5);let w=recordShow('バウホール公演',true);feed('バウ主演の知らせ',`『${w.title}』で主演級に抜擢された。相手役は${w.partner}。`)}else improve('team')}else if(mode==='rest'){gain('energy',4)}else if(mode==='pop'){gain('pop',1)}else if(mode==='outing'){let p=eventFriend();if(p)bumpFriend(p.name,5);improve('team')}else{improve(mode)}if(c.friend)bumpFriend(c.friend,5);feed(evt.name,c.label,'choice');adjustRank();save();render()}
function stagedChoice(name,text,choices){game.pending={name,text,kind:'choice',choices};stop();save();render()}
function eventPool(){let y=game.year,p=eventFriend(),friend=p?.name||'同期';let pool=y<=2?[['基礎稽古の後で',`同期の${friend}と発声や振付を確認した。`,'song'],['初舞台の舞台袖','ラインダンス前の緊張を整えた。','energy'],['上級生の助言',`上級生の稽古を見て${friend}と意見を交わした。`,'team'],['舞台化粧の研究','自分らしい舞台化粧に慣れていく。','aura']]:y<=7?[['歌劇誌・ポートレート撮影','歌劇誌の撮影があり、立ち姿を工夫した。','aura'],['新人公演稽古',`${friend}と芝居合わせの段取りを確認した。`,'acting'],['公演後のファンレター','ファンから感想が届き、次の公演の励みとなる。','pop'],['スカイ・ステージの番組収録','舞台の見どころをコメントする番組に出演した。','pop'],['同期の食事会',`${friend}と公演後に食事をした。`,'team'],['怪我の予防','ストレッチと休養を意識した。','energy']]:y<=12?[['宝塚GRAPHの特集撮影','ポートレート撮影とインタビューを受けた。','aura'],['宝塚カレンダーの撮影','公演での活躍をきっかけに撮影の仕事が入った。','pop'],['スカイ・ステージのトーク番組',`${friend}と舞台についての対談を収録した。`,'team'],['若手との稽古',`${friend}と新しい振付を確認した。`,'dance'],['私設ファンクラブのお茶会','公演を振り返るお茶会が行われた。','pop'],['舞台写真の撮影','役の感情が伝わる表情を探った。','acting']]:[['上級生の対談番組','スカイ・ステージでこれまでの舞台人生を振り返った。','team'],['宝塚GRAPHの表紙撮影','劇団の刊行物向けの撮影があった。','aura'],['下級生の相談',`${friend}から舞台上の立ち回りを相談された。`,'team'],['全国ツアーの準備','長い移動と公演に備えた。','energy'],['カレンダー撮影','新たなポートレート撮影に臨んだ。','aura']];return pick(pool)}
function step(){if(!game||game.ended||game.pending)return;ensureExtra();let s=game;if(s.phase===0){s.phase=1;addAuto('宝塚音楽学校・予科','宝塚音楽学校に入学。舞台を目指した生活が始まる。','team');return}if(s.phase===1){s.phase=2;s.calendar=s.entry-1;addAuto('本科生・文化祭','文化祭で同期と舞台に立つ。','dance');return}if(s.phase===2){s.phase=3;s.calendar=s.entry;s.year=1;s.troupe=pick(GROUPS);s.part=0;addAuto('初舞台・組配属',`${s.term}期の初舞台を踏み、${s.troupe}に配属された。`,'team');return}

 if(s.part===1){s.part=2;let w=recordShow();let p=eventFriend();if(p)bumpFriend(p.name,2);addAuto(`本公演『${w.title}』`,`『${w.title}』に${w.role}として出演した。${p?p.name+'とも稽古を重ねた。':''}${w.forecast?'今後の公演はゲーム内予測。':''}`,'acting',p?.name);return}
 if(s.part===2){s.part=3;let p=eventFriend(),rival=p?.name||'別の若手生徒';if(s.year<=7){let rivals=activeCandidates().filter(x=>x.group===s.troupe && (s.role==='娘役'?x.kind==='娘役':x.kind!=='娘役') && s.calendar-entryTerm(pplTerm(x))<8);if(rivals.length)rival=pick(rivals).name;}if(s.year<=7){stagedChoice('新人公演の配役争い',`『${chooseShow().title}』の新人公演。${rival}らとの稽古を経て、主演・ヒロイン候補の選考が進む。`,[{label:'演技に集中し、主演を狙う',effect:'rookie',rival},{label:'仲間を支えながら配役を目指す',effect:'rookie',rival}]);return}else{stagedChoice('別箱公演の役付き',`${s.troupe}の次の舞台で、重要な役を任される可能性がある。`,[{label:'バウ・東上での主演を目指す',effect:'bau',friend:rival},{label:'本公演の役作りを深める',effect:'acting',friend:rival}]);return}}
 if(s.part===3){s.part=4;if(maybeRoleSwitch())return;stageCareerChoice();return}

  if(game.popups)game.popups=game.popups.filter((p,i)=>i<popupLength||!p.title.includes('トップ就任'));

// The record picker must honor the type and venue: a Bow lead never automatically
// gets credited as a Drama City lead just because both titles share a year/troupe.
function v14Candidates(kind){
 const pool=V9_BOXES.filter(r=>r.year===game.calendar&&r.troupe===game.troupe);
 if(/バウ/.test(kind))return pool.filter(r=>r.theatre==='宝塚バウホール');
 if(/東上/.test(kind))return pool.filter(r=>r.theatre.includes('ドラマシティ'));
 return pool;
}

 // 同一年の重複実行を防止。通常は年1名、時折2名。

  const pool=v15AllPeople().filter(p=>{
   const term=pplTerm(p);if(!term||term>108||year-entryTerm(term)<4||year-entryTerm(term)>17)return false;
   const g=groupInYear(p.name,year);if(!V15_TROUPES.includes(g))return false;

   if(!v15IsRoad(p))return false;
   if(taken.has(p.name)||v.futureTransfers.some(t=>t.name===p.name&&year-t.year<4))return false;
   return true;
  }).sort((a,b)=>v15Hash(`${year}|${a.name}|transfer`)-v15Hash(`${year}|${b.name}|transfer`));

  targets.sort((a,b)=>v.groups[a].ranks.length-v.groups[b].ranks.length||v15Hash(person.name+a+year)-v15Hash(person.name+b+year));

function v17Ensure(){

 else to=other[Math.floor(Math.random()*other.length)];

 }

function v17WomanPool(){
 v17Ensure();const yr=game.calendar;
 const people=[...REAL_PEOPLE,...(typeof HEROINE_DATA==='undefined'?[]:HEROINE_DATA)];
 const distinct=new Map();for(const p of people){if(p.kind==='娘役'&&p.name&&!distinct.has(p.name))distinct.set(p.name,p)}
 const topWomen=new Set();
 if(yr>=2027){v15Ensure();v15AdvanceRoster(yr);for(const g of V15_TROUPES)topWomen.add(game.v15.groups[g].heroine)}
 else{const data=v16HistoryRoster(yr);for(const g of V15_TROUPES)topWomen.add(data[g].heroine)}
 // 史実上の退団者、未来シミュレーションで退団した人を含めない。
 return [...distinct.values()].filter(p=>{
  let term=pplTerm(p);if(!term||entryTerm(term)>yr||topWomen.has(p.name))return false;
  if(game.v15?.retired?.includes(p.name))return false;
  if(typeof v8RetDate==='function'&&v8RetDate(p)&&Number(v8RetDate(p).slice(0,4))<=yr)return false;

 });
}
function v17HeroineOptions(){

function v19Term(name){if(name===game?.name)return game.term;const p=v15AllPeople().find(x=>x.name===name);return p?pplTerm(p):null}
function v19SortRanks(line){

 // 学年が上の生徒が基本的に先順位。ごくまれな逆転は昇進実績・能力差によって許容する。

// バウ主演の実績がない生徒を番手として扱わない。未来の架空公演で
// 主演を割り当てた場合はその記録を明示的に保存してから候補に含める。
function v20BauEligible(name, year){
 if(name===game?.name)return (game.flags.bau||0)>0;
 if(V20_CONFIRMED_BOW[name]!==undefined && V20_CONFIRMED_BOW[name]<=year)return true;
 return !!game?.v20?.futureBowLeads?.some(r=>r.name===name&&r.year<=year);
}
function v20FutureBow(name,year,title){
 if(!game)return;
 game.v20??={futureBowLeads:[]};game.v20.futureBowLeads??=[];
 if(!game.v20.futureBowLeads.some(r=>r.name===name&&r.year===year))
   game.v20.futureBowLeads.push({name,year,title:title||'バウホール主演（ゲーム内予測）'});
}
function v20EligibleRankPerson(name,group,year){
 if(!name || name===game.v15.groups[group]?.top)return false;
 if(game.v15.retired.includes(name))return false;
 if(name===game.name)return game.troupe===group&&game.role==='男役'&&v20BauEligible(name,year);
 const person=v15AllPeople().find(p=>p.name===name);
 if(!person)return false;
 if(groupInYear(name,year)!==group)return false;
 if(entryTerm(pplTerm(person))>year)return false;
 return v20BauEligible(name,year);
}
// 2026年の人事は史実を優先し、2027年からのゲーム内推計だけを整える。
function v20NormalizeRank(group,year){
 if(!game?.v15||year<2027)return;
 const line=game.v15.groups[group];if(!line)return;
 const previous=[...line.ranks];
 line.ranks=[...new Set(previous)].filter(n=>v20EligibleRankPerson(n,group,year));
 // 通常は2番手・3番手各1名。W2/W3の追加枠がある場合のみ3人目を保持。
 line.ranks=line.ranks.slice(0,(line.doubleSecond||line.doubleThird)?3:2);
 if(line.ranks.length<2){line.doubleSecond=false;line.doubleThird=false;}
 if(line.ranks.length<3){line.doubleThird=false;}
}
// 未主演の夢奈瑠音は候補にできない。実際の出演・助演歴は残す。
const v20PreviousCandidate=v15Candidate;
v15Candidate=function(group,year,exclude=[]){
 const pool=v15AllPeople().filter(p=>p.name!==game?.name&&!exclude.includes(p.name)&&
   groupInYear(p.name,year)===group && entryTerm(pplTerm(p))<=year &&
   year-entryTerm(pplTerm(p))>=5 && v20BauEligible(p.name,year));
 return pool.sort((a,b)=>v15PersonScore(b,year)-v15PersonScore(a,year))[0];
};
const v20PreviousFill=v15FillVacancy;
v15FillVacancy=function(group,year,post){
 if(year<2027)return v20PreviousFill(group,year,post);
 const line=game?.v15?.groups?.[group];if(!line)return null;
 if(post==='top'){
   // バウ主演歴のある2番手候補のみトップへの昇格を認める。
   const prior=[...line.ranks];
   line.ranks=line.ranks.filter(n=>v20EligibleRankPerson(n,group,year));
   const result=v20PreviousFill(group,year,post);
   if(!result)line.ranks=prior.filter(n=>v20EligibleRankPerson(n,group,year));
   return result;
 }
 if(typeof post!=='number'||post>2)return null;
 // 3人目はW番手の時だけ許可。4番手発表は行わない。
 if(post===2 && !line.doubleSecond && !line.doubleThird)return null;
 const chosen=v20PreviousFill(group,year,post);
 if(chosen&&!v20BauEligible(chosen,year)){
   line.ranks=line.ranks.filter(n=>n!==chosen);
   return null;
 }
 return chosen;
};
const v20PreviousNotice=v15Notice;
v15Notice=function(year,title,message,major=false){
 // 未来の組替えが生じた年だけポップアップ。過去イベントの再生時は表示しない。
 if(year>=2027&&/組替え/.test(title))major=true;
 // 旧コードで「4番手」とされた通知は正しい3番手候補の表記へ。
 if(/番手昇格（仮想人事）/.test(title)&&/4番手/.test(message))message=message.replace(/4番手/g,'3番手候補');
 return v20PreviousNotice(year,title,message,major);
};
const v20PreviousAdvance=v15AdvanceRoster;
v15AdvanceRoster=function(year){
 if(!game?.v15)return v20PreviousAdvance(year);
 const before=game.v15.year;
 // 年初時点のデータを整理し、旧処理が不適格者を昇格させないようにする。
 if(before>=2027)for(const g of V15_TROUPES)v20NormalizeRank(g,before);
 const out=v20PreviousAdvance(year);
 if(year>=2027){
   for(const g of V15_TROUPES){
     const line=game.v15.groups[g];
     v20NormalizeRank(g,year);
     // Prevent an endless refill cycle when eligibility normalization removes the newly added candidate.
     // A candidate that fails normalization must not be retried within this year.
     const tried=new Set();
     for(let attempt=0;line.ranks.length<2&&attempt<4;attempt++){
       const before=line.ranks.join('|');
       const proposed=v15FillVacancy(g,year,line.ranks.length);
       if(!proposed||tried.has(proposed))break;
       tried.add(proposed);
       v20NormalizeRank(g,year);
       if(line.ranks.join('|')===before || !line.ranks.includes(proposed))break;
     }
   }
 }
 return out;
};
// 画面表示でも、2番手の次は3番手のみ。未適格候補を昇格済みと誤表示しない。
const v20PreviousRanks=v18RanksFor;
v18RanksFor=function(year,group){
 const prior=v20PreviousRanks(year,group);
 if(year<2027||!game?.v15)return prior;
 v20NormalizeRank(group,year);
 const line=game.v15.groups[group];
 const second=line.doubleSecond&&line.ranks.length>=2
  ?line.ranks.slice(0,2).join('・')+'（W2番手）':(line.ranks[0]||'空席');
 const third=line.doubleSecond?(line.ranks[2]||'空席'):
  (line.doubleThird&&line.ranks.length>=3?line.ranks.slice(1,3).join('・')+'（W3番手）':(line.ranks[1]||'空席'));
 return {...prior,second,third,secondNames:line.doubleSecond?line.ranks.slice(0,2):line.ranks.slice(0,1),thirdNames:line.doubleSecond?line.ranks.slice(2,3):line.doubleThird?line.ranks.slice(1,3):line.ranks.slice(1,2)};
};

// 各人の組替えはキャリアで一度だけ抽選。50％の抽選を確率モデルとして保存。
function v21Transfers(year){
 if(!game||year<2027)return;
 v15Ensure();const v=game.v15;
 v.v21TransferPlan??={};v.v21ExtraDone??=[];
 // 未来の路線スター・娘役を対象。本人と歴代トップ・既退団者は除く。
 const pool=v15AllPeople().filter(p=>{
   const term=pplTerm(p);const tenure=year-entryTerm(term)+1;
   if(!term||p.name===game.name||tenure<5||tenure>17||v.retired.includes(p.name))return false;
   const troupe=groupInYear(p.name,year);
   if(!V15_TROUPES.includes(troupe)||Object.values(v.groups).some(x=>x.top===p.name||x.heroine===p.name))return false;
   return v15IsRoad(p)||p.kind==='娘役';
 });
 for(const p of pool){
   let plan=v.v21TransferPlan[p.name];
   if(!plan){
     const hash=v15Hash(`${game.seed}|${p.name}|v21`);
     const selected=hash%100<50;
     // 計画年を入団から5〜11年目に設定。2027年以前のキャリアは未来最初の数年に分配。
     const earliest=Math.max(2027,entryTerm(pplTerm(p))+4);
     const planned=earliest+(Math.floor(hash/101)%6);
     plan=v.v21TransferPlan[p.name]={selected,year:planned};
   }
   if(!plan.selected||plan.year!==year||v.v21ExtraDone.includes(p.name))continue;
   // 既存の未来予測で組替え済みなら二重発生させない。
   if(v.futureTransfers?.some(t=>t.name===p.name)){v.v21ExtraDone.push(p.name);continue;}
   const from=groupInYear(p.name,year);
   const destinations=V15_TROUPES.filter(t=>t!==from);
   destinations.sort((a,b)=>v.groups[a].ranks.length-v.groups[b].ranks.length||v15Hash(p.name+a)-v15Hash(p.name+b));
   const to=destinations[0];
   v.futureTransfers??=[];
   v.futureTransfers.push({year,name:p.name,from,to,role:p.kind==='娘役'?'娘役':'男役',forecast:true,v21:true});
   v.v21ExtraDone.push(p.name);
   v.groups[from].ranks=v.groups[from].ranks.filter(n=>n!==p.name);
   v15Notice(year,'組替え（仮想人事）',`${p.name}（${p.kind==='娘役'?'娘役':'男役'}）が${from}から${to}へ。新しい組での舞台活動が始まる。`,true);
 }
}

// 出演経歴の検索対象として、登録済みの実在別箱主演記録も読み取る。
v21PersonCredits=function(p,year){
 const norm=x=>String(x||'').replace(/\s/g,'');
 const name=norm(p.name);
 const boxes=V14_BOXES.filter(w=>w.year<=year&&norm(w.lead)===name);
 const bow=boxes.filter(w=>w.theatre==='宝塚バウホール').map(w=>`${w.year}『${w.title}』`);
 const tojo=boxes.filter(w=>w.theatre.includes('ドラマシティ')).map(w=>`${w.year}『${w.title}』`);
 const rookie=(p.kind==='娘役'?(p.credits||[]):[]).filter(c=>c.year<=year).map(c=>`${c.year}『${c.title}』`);
 const future=game?.v20?.futureBowLeads?.filter(w=>w.name===p.name&&w.year<=year).map(w=>`${w.year}『${w.title}』（予測）`)||[];
 const actualBau=V20_CONFIRMED_BOW[p.name]&&V20_CONFIRMED_BOW[p.name]<=year&&!bow.length?[`${V20_CONFIRMED_BOW[p.name]}年（主演作の作品名未収録）`]:[];
 const sourceRookie=(p.kind==='娘役'?[]:REAL_SHOWS.filter(w=>w.year<=year&&JSON.stringify(w.cast?.rookie||[]).includes(p.name)).map(w=>`${w.year}『${w.title}』`));
 return {rookie:p.kind==='娘役'?rookie:sourceRookie,bow:[...new Set([...bow,...future,...actualBau])],tojo:[...new Set(tojo)],heroine:[],eto:[]};
};

function v22RetirementPlan(name,term){

function v22NPCDepartures(year){
 if(!game||year<2027)return;v15Ensure();
 let v=game.v15;v.v22RetirementNotified??=[];
 const everyone=v15AllPeople().slice();
 for(const p of everyone){
  const name=p.name;const term=pplTerm(p);
  if(!term||name===game.name||!V15_TROUPES.includes(groupInYear(name,year)))continue;
  const line=Object.values(v.groups).find(g=>[g.top,g.heroine,...g.ranks].includes(name));
  if(line||v15IsRoad(p)||v.retired.includes(name)||v.v22RetirementNotified.includes(name))continue;
  const career=year-entryTerm(term)+1;
  const plan=v22RetirementPlan(name,term);
  if(!plan?.selected||career<plan.tenure)continue;
  v.retired.push(name);v.v22RetirementNotified.push(name);
  v15Notice(year,'路線外生徒の退団（仮想人事）',`${name}（研${career}）が退団。以後、現役の交友や配役争いから外れる。`,false);

}

// v26: Long-play safety fix. Keep the entire accumulated game logic, but batch all
// synchronous DOM and localStorage updates produced by a single yearly step.
let v26InStep = false;
let v26NeedsSave = false;
let v26NeedsRender = false;
const v26OriginalSave = save;
const v26OriginalRender = render;
save = function(){
  if(v26InStep){v26NeedsSave=true;return;}
  return v26OriginalSave();
};
render = function(){
  if(v26InStep){v26NeedsRender=true;return;}
  return v26OriginalRender();
};
const v26OriginalStep = step;
step = function(){
  if(!game || game.ended || game.pending || v26InStep) return;
  v26InStep = true;
  try {
    v26OriginalStep();
  } catch(error) {
    // Do not leave automatic advance locked after an error. Keep current save usable.
    console.error('すみれの軌跡: 年次進行の処理エラー',error);
    playing=false;clearTimeout(timer);
    if(game){game.lastStepError=String(error?.message||error);}
  } finally {
    v26InStep=false;
    if(v26NeedsSave || v26NeedsRender){
      v26NeedsSave=false;v26NeedsRender=false;
      v26OriginalSave();v26OriginalRender();
    }
  }
};

// Predicted 5-troupe personnel updates used to produce dozens of popups in a
// single transition. The timeline still contains all personnel changes.
// Aggregate only the numerous predicted NPC personnel popups; do not suppress
// player milestones, retirement, partner, or other personal notifications.
const v26OriginalNotice = v15Notice;
v15Notice = function(year,title,message,major=false){
  const npcPrediction = year>=2027 && /仮想人事|ゲーム内予測|予測/.test(title) &&
    /番手|組替え|退団|W2|W3/.test(title) &&
    !String(message).includes(game?.name||'___player___');
  if(npcPrediction) major=false;
  return v26OriginalNotice(year,title,message,major);
};

// Safety: a saved game can already contain a huge modal queue. Display the
// newest important notification, keeping every other event in the timeline.
const v26OriginalPopup = popMajor;
popMajor = function(title,body){
  if(!game)return;
  game.popups ??=[];
  if(game.popups.length>=3){
    // Important updates are retained in the journal; never accumulate hundreds
    // of blocking overlays during one yearly rollover.
    if(game.events)game.events.push({id:game.events.length+1,year:game.calendar,
      age:currentAge(),phase:`研${game.year}`,name:`通知：${title}`,text:body,kind:'auto'});
    return;
  }
  return v26OriginalPopup(title,body);
};
const v26OriginalClose = closeMajor;
closeMajor = function(){
  const autoWasOn = !!game?.v26AutoRequested;
  v26OriginalClose();
  if(autoWasOn && game && !game.pending && !game.ended && !(game.popups?.length)){

// Allow the auto toggle to remain requested across modal notifications. Pause

const v26OriginalToggle = togglePlay;

};
const v26OriginalSchedule = schedule;

};

// Stop the most expensive of the future-personnel passes from rescanning every
// active actress whenever an already completed year is displayed.
const v26PreviousRosterAdvance = v15AdvanceRoster;
v15AdvanceRoster = function(year){
  if(!game)return;
  const target=Number(year);
  if(!Number.isFinite(target))return;
  if(game.v15 && target<=game.v15.year && game.v26FemaleScanYear>=target) return;
  v26PreviousRosterAdvance(target);
  if(game.v15 && target>=2027)game.v26FemaleScanYear=target;
};

// A smaller number of screens at a time is more stable on Safari. Do not delete
// the underlying career record; the journal already keeps its compact view.
const v26OriginalContinue = continueGame;
continueGame = function(){
  v26OriginalContinue();
  if(!game)return;
  if((game.popups?.length||0)>3){
    const count=game.popups.length;
    game.popups=game.popups.slice(-2);
    feed('通知の整理',`以前のバージョンで蓄積された${count}件の通知を整理。人事履歴は人生の記録に保存されています。`);
  }
  game.v26FemaleScanYear ??= Math.max(2026,game.v15?.year||2026);
  save();render();
};

// Re-arm requested automatic playback after both old and new styles of choice.
function v26ResumeAuto(){
  if(!game?.v26AutoRequested || game.ended || game.pending?.choices)return;
  if(game.popups?.length)return;
  playing=true;schedule();
}
const v26OriginalRunGameChoice=runGameChoice;
runGameChoice=function(index){
  const result=v26OriginalRunGameChoice(index);
  v26ResumeAuto();
  return result;
};
const v26OriginalProcessChoices=processChoices;
processChoices=function(index){
  const result=v26OriginalProcessChoices(index);
  v26ResumeAuto();
  return result;
};

// Last-resort recovery: if a rare old save encounters an unhandled annual event,
// advance past that one event instead of forcing the user into a permanent loop.
// The error remains available on the saved game for diagnosis.
const v26OuterStep=step;
step=function(){
  const oldPart=game?.part,oldYear=game?.calendar;
  v26OuterStep();
  if(!game?.lastStepError || game.ended || game.pending)return;
  const error=game.lastStepError;
  game.lastStepError=null;
  if(game.part===oldPart && game.calendar===oldYear){
    if(game.part>=7){game.year++;game.calendar=game.entry+game.year-1;game.part=0;}
    else game.part=Math.max(0,(game.part||0)+1);
  }
  feed('進行データの自動修復',`互換性のない旧イベントを1件スキップし、進行を再開しました。（${error.slice(0,110)}）`);
  save();render();
};

 const royal=/ベルサイユ|ベルばら|オスカル|マリー・アントワネット|フェルゼン|アンドレ|1789|宮廷|王家|王妃|皇帝/.test(title+' '+r);
 const i=(game.role==='男役'?0:3)+(japanese?2:royal||game.role==='娘役'&&/エリザベート|皇后|シシィ/.test(title+' '+r)?1:0);
 const pet=game.pet?`<div class="v28pet">${esc(V8_PETS[game.pet.kind]?.[0]||'ペット')}：${esc(game.pet.name||'')}</div>`:'';
 return `<div class="v25illustration v28portrait"><img width="508" height="508" src="${V28_ART[i]}" alt="${esc(game.role)}の舞台イラスト" decoding="async"><div class="v25workcaption">${esc(title)}${r?'｜'+esc(r):''}</div>${pet}</div>`;
}
pixelArt=v28Portrait;
function v28Offer(){const d=v28TopData();const slot=game.calendar+':'+game.part;
 if(d.slots[slot])return false;
 // The first six events are ordered. Later scenes rotate without repetition.
 const index=Array.from({length:24},(_,i)=>i).find(i=>!d.seen.includes(i));
 if(index===undefined)return false;
 const [title,body,a,k,b,l]=V28_TOP_EVENTS[index];
 d.slots[slot]=true;d.seen.push(index);
 const female=game.role==='娘役';
 const caption=female&&index===4?'大劇場お披露目の衣装':female&&index===21?'ミュージック・サロンの構成相談':female&&index===22?'ミュージック・サロンの打ち合わせ':title;
 const text=female&&index===4?'新体制の初めての本公演。フィナーレの衣装と階段降りを確認する。':body;
 game.pending={name:caption,text,kind:'choice',v28TopIndex:index,choices:[
 {label:a,effect:'v28Top',key:k,delta:k==='pop'?3:2,stress:4,detail:V28_STAT_LABEL[k]+' ＋'+(k==='pop'?3:2)+'／ストレス ＋4'},
 {label:b,effect:'v28Top',key:l,delta:l==='pop'?3:2,stress:2,detail:V28_STAT_LABEL[l]+' ＋'+(l==='pop'?3:2)+'／ストレス ＋2'},
 {label:'相手役や組長と相談して進める',effect:'v28Top',key:'team',delta:2,stress:-2,detail:'協調性 ＋2／ストレス −2'},
 {label:'予定を調整し、休息を確保する',effect:'v28Top',key:'',delta:0,stress:-8,detail:'ストレス −8／能力・人気は変化なし'}]};
 save();render();return true;
}
function v28Farewell(){if(!game?.flags?.top)return;const d=v28TopData();if(d.farewell)return;d.farewell=true;
 // Finish in chronological order before recording retirement. Bypass generic stress text heuristics.
 for(let i=24;i<30;i++){const [title,body]=V28_TOP_EVENTS[i];d.seen.push(i);v25PriorFeed(title,body,'auto');}
}
const v28PreviousFeed=feed;
feed=function(name,text,kind='auto'){
 if(game?.flags?.top&&game.ended&&/^(退団|退団を決意|宝塚歌劇団を退団)$/.test(name))v28Farewell();
 return v28PreviousFeed(name,text,kind);
};
const v28PreviousStep=step;
step=function(){if(!game||game.ended||game.pending||game.v17?.partnerPending||game.popups?.length)return;
 if(game.phase===3&&game.flags?.top&&v28Offer())return;
 v28PreviousStep();if(game?.ended&&game.flags?.top){v28Farewell();save();render();}
};
const v28PreviousChoice=runGameChoice;
runGameChoice=function(index){const e=game?.pending,c=e?.choices?.[index];if(c?.effect!=='v28Top'){const r=v28PreviousChoice(index);if(game?.ended&&game.flags?.top){v28Farewell();save();render();}return r;}
 game.pending=null;if(c.key)v25PriorGain(c.key,c.delta);v25Stress(c.stress);
 v25PriorFeed(e.name,c.label+'。'+c.detail,'choice');save();render();v26ResumeAuto();
};
</script><style>
.v25stress{background:#fff5f7;border:1px solid #eacbd5;border-radius:9px;margin-top:10px;padding:10px;font-size:13px;grid-column:1/-1}.v25stress span{display:flex;justify-content:space-between}.v25track{height:9px;background:#e8e0e4;border-radius:20px;overflow:hidden;margin:6px 0}.v25track i{display:block;height:100%;border-radius:20px;transition:width .25s}.v25stress small{color:#805e6d}.v25illustration{background:#fff7fa;border:2px solid #e4b9cf;border-radius:12px;padding:8px;text-align:center;margin:12px auto}.v25illustration svg{display:block;margin:auto;width:min(100%,310px);height:auto}.v25workcaption{font-size:12px;color:#774a66;padding:5px}
.v28portrait{max-width:340px}.v28portrait img{display:block;width:100%;height:auto;border-radius:9px;aspect-ratio:1;object-fit:cover}.v28pet{color:#79566c;font-size:12px;padding:2px}</style></body></html>
