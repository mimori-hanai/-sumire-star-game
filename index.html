 [{title:'上級生としての責任',body:'後輩をまとめつつ自分の表現を深める時期。',a:['組全体の完成度を優先','新境地の役に挑戦する'],stats:['team','acting']},{title:'新しい作品への挑戦',body:'作風の異なる作品の出演依頼が重なる。',a:['舞踊の表現を更新する','台本の細部を読み解く'],stats:['dance','acting']},{title:'公演期間と体調管理',body:'長い公演期間で疲労が蓄積してきた。',a:['休養をしっかり取る','身体のケアを学ぶ'],stats:['energy','team']},{title:'舞台人としての選択',body:'今後の活動を考える節目が訪れた。',a:['次の大役への可能性を探る','現在の役を丁寧に務める'],stats:['aura','acting']}]];
 let d=pick(pools[group]);return {title:d.title,body:d.body,items:d.a.map((a,i)=>({label:a,text:a+'ことを選んだ。小さな積み重ねが次の舞台につながる。',run:()=>{if(d.stats[i]==='energy')gain('energy',3);else improve(d.stats[i]);gain('energy',-1)}}))}}
function nextStep(){save();render();if(playing&&!game.pending&&!game.ended)schedule()}
function fastTick(){if(!game||game.ended)return;if(game.pending?.choices){stop();render();return}if(game.pending){applyEvent(true);return}step();save();render();if(playing&&!game?.pending?.choices)schedule()}
function schedule(){clearTimeout(timer);if(!playing)return;timer=setTimeout(fastTick,Math.max(200,1100/speed))}function stop(){playing=false;clearTimeout(timer)}function togglePlay(){playing=!playing;if(playing)schedule();render()}
function fmtProfile(){let s=game,info=[['芸名',s.name],['本名（架空）',s.real],['誕生日（架空）',s.birth],['音楽学校入学時の年齢',s.age+'歳'],['期',s.term+'期（'+s.entry+'年入団）'],['身長（架空）',s.height+'cm'],['出身地（架空）',s.region],['出身校（架空）',s.school],['音楽学校受験',s.attempt+'回目で合格'],['憧れの先輩（設定）',s.admire],['家族の職業（架空）',s.parentJob],['志望',s.role],['所属組',s.troupe]];return `<section class="panel profile"><h2>スター・プロフィール</h2><dl>${info.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><p class="note">本名・生年月日・家族の職業などは主人公の架空プロフィールです。実在の生徒の非公開個人情報は使用していません。</p></section>`}
function statsSmall(){return `<div class="statrow">${Object.entries(SKILLS).map(([k,l])=>`<div class="stat">${l}<b>${game.stats[k]}</b><div class="meter"><span style="width:${game.stats[k]}%"></span></div></div>`).join('')}</div>`}
function statsSide(){return `<aside class="side"><div class="statside panel"><div class="sidehead">${esc(game.name)} · ${esc(game.troupe)}</div><p class="mini">${game.term}期／${game.role}／研${game.year||'—'}</p>${Object.entries(SKILLS).map(([k,l])=>`<div class="statline"><span>${l}</span><div class="bar"><i style="width:${game.stats[k]}%"></i></div><b>${game.stats[k]}</b></div>`).join('')}<hr><div class="mini">新人公演${game.role==='男役'?'主演':'ヒロイン'}：${game.flags.rookie}回<br>バウホール主演級：${game.flags.bau}回<br>私設FC：${game.club.level?'発足':'未発足'}<br>お茶会・お茶飲み会：${game.club.meet}回</div><button class="btn smallbutton" onclick="tab='profile';render()">プロフィール</button></div></aside>`}
function journal(){let a=game.events.slice().reverse();return `<section class="panel"><h2>人生の記録 <span style="font-size:11px;color:#728086">新しい順</span></h2>${game.pending?.choices?`<div class="notice"><b>${esc(game.pending.name)}</b><p>${esc(game.pending.text)}</p><div class="actions">${game.pending.choices.map((x,i)=>`<button onclick="processChoices(${i})">${esc(x.label)} →</button>`).join('')}</div></div>`:''}${a.length?a.map(x=>`<div class="event ${x.kind}"><time>${x.age}歳<br>${x.year}年</time><div><strong>${esc(x.name)}</strong><p>${esc(x.text)}</p><span class="details">${esc(x.phase)} ・ ${x.kind==='auto'?'自動イベント':'選択イベント'}</span></div></div>`).join(''):'<p class="muted">「次へ」で人生が進みます。イベントには自動で発生するものと、選択肢が表示されるものがあります。</p>'}</section>`}
function showWorks(){return `<section class="panel"><h2>出演演目・配役</h2><p class="note">下記の演目・役付きは物語上の創作です。実在の公演履歴ではありません。</p>${game.performances.slice().reverse().map(p=>`<div class="history"><b>${esc(p.year)}年 ${esc(p.troupe)} 『${esc(p.title)}』</b>${esc(p.kind)}／${esc(p.role)}</div>`).join('')||'<p class="muted">初舞台の後に記録されます。</p>'}</section>`}
function people(){let arr=REAL_PEOPLE.filter(x=>x.kind==='現役');let real=game?.calendar||2026,term=game?.term||102;let fit=arr.filter(p=>pplTerm(p)<=108&&entryTerm(pplTerm(p))<=real&&p.group===game?.troupe);return `<section class="panel"><h2>関係者・同期・ライバル</h2><p class="note">登場する実在人物の氏名・期は提供された名簿に基づきます。主人公との交流、配役争い、会話、組内での出会いは架空であり、実在の本人の発言や実際の人事を意味しません。過去の所属や実際の退団年は簡略化しています。</p><h3>同じ組・この年までに入団した人物</h3>${fit.map(p=>`<div class="history"><b>${esc(p.name)}（${pplTerm(p)}期）</b>${esc(p.position)}<br>${esc(p.bio)}</div>`).join('')||'<p class="muted">現在の条件で該当する登録人物はいません。</p>'}<details><summary>登録された現役生徒一覧</summary>${GROUPS.map(g=>`<h3>${g}</h3>${arr.filter(p=>p.group===g).map(p=>`<span class="tag">${esc(p.name)} ${pplTerm(p)}期</span>`).join('')}`).join('')}</details><details><summary>OG（近年退団の元トップスター）</summary>${REAL_PEOPLE.filter(p=>p.kind==='OG').map(p=>`<div class="history"><b>${esc(p.name)}</b>${esc(p.bio)}</div>`).join('')}</details></section>`}
function gameScreen(){return `<div class="split"><div class="column"><section class="panel"><div class="topbar"><div><span class="age">${currentAge()}</span>歳 <small>${game.calendar}年 · ${game.term}期 · ${game.year?'研'+game.year:game.phase===0?'予科':game.phase===1?'本科':'初舞台準備'}</small></div><small>${esc(game.name)} ／ ${esc(game.troupe)}</small></div><div class="progress"><span style="width:${(Math.min(game.year,19)/19)*100}%"></span></div><div class="controls"><button class="${playing?'selected':''}" onclick="togglePlay()">${playing?'Ⅱ 停止':'▶ 自動'}</button>${[1,2,4,8,12].map(v=>`<button class="${speed===v?'selected':''}" onclick="speed=${v};if(playing)schedule();render()">${v}×</button>`).join('')}<button onclick="fastTick()" ${game.pending?.choices||game.ended?'disabled':''}>次へ »</button><button onclick="tab='profile';stop();render()">プロフィール</button></div><div class="stage"><span class="pixel">🏰</span><span class="pixel">🎭</span><span class="pixel">💃</span><span class="pixel">🎶</span><span class="pixel">🏰</span></div><div class="identity">${game.phase<3?`宝塚音楽学校 ${game.term}期。${game.name}は舞台人となるために学んでいる。`:`${game.troupe}・${game.role}・${game.term}期。${game.year}年目の舞台人生。人気 ${game.stats.pop}/100。`}<div class="muted">選択しなくても起こる出来事と、判断を求められる出来事が時系列で積み重なります。</div></div><div class="panel sticky">${statsSmall()}</div><div class="row" style="margin-bottom:12px"><button class="btn ${tab==='timeline'?'primary':''}" onclick="tab='timeline';render()">人生の記録</button><button class="btn ${tab==='works'?'primary':''}" onclick="tab='works';render()">出演作品</button><button class="btn ${tab==='people'?'primary':''}" onclick="tab='people';render()">関係者</button></div>${game.ended?`<div class="end"><h2>舞台人生の幕が下りた</h2><p>${game.flags.top?'トップ就任を果たしました。':'退団までの歩みを振り返りましょう。'}</p></div>`:''}${tab==='works'?showWorks():tab==='people'?people():journal()}<p class="note">本作は非公式の架空作品です。公開制度を参考にしていますが、配役・公演タイトル・共演・新人公演の結果は創作です。</p></section></div>${statsSide()}</div>`}
function profileScreen(){return `<div class="split"><div><section class="panel"><h2>最初のステータス</h2>${statsSmall()}<p class="muted">初期能力は控えめです。成長速度を抑え、舞台経験を通じて少しずつ伸びる設計です。</p></section>${fmtProfile()}<section class="panel"><h3>これからの人生</h3><p>宝塚音楽学校の予科・本科、初舞台、組配属、新人公演（研7まで）、別箱公演、私設ファンクラブ、お茶会、組替え、退団までを時系列で描きます。</p><p class="notice">期は95〜108期から無作為に決定します。同期・先輩・後輩は入団年を考慮して登場します。なお、同じ組という設定はゲーム内の架空の時系列であり、実際の組配属・共演を保証しません。</p><div class="row"><button class="btn primary" onclick="tab='timeline';render()">この人生を始める →</button><button class="btn" onclick="newGame()">プロフィールを再抽選</button></div></section></div>${statsSide()}</div>`}
function home(){return `<div class="panel hero"><div class="muted">TAKARAZUKA LIFE SIMULATOR</div><h1>すみれの軌跡</h1><p>95〜108期のいずれかに生まれ、音楽学校から舞台人生を進める。<br>配役・新人公演・組替え・私設ファンクラブ・退団まで。</p><p class="muted">時間が流れ、思いがけない出来事や選択が積み重なる人生シミュレーション。</p><div class="row" style="justify-content:center"><button class="btn pink" onclick="newGame()">新しい人生を始める</button>${saved()?'<button class="btn" onclick="continueGame()">前回の続きから</button>':''}</div><p class="note">非公式のファン制作・架空のシミュレーション。実在人物の会話・主人公との共演・配役の競争はフィクションです。</p></div><section class="panel"><h3>考証に用いた参考資料</h3><p class="mini"><a href="https://www.tms.ac.jp/guidance/admissions.html" target="_blank">宝塚音楽学校：募集要項</a>（予科・本科の2年制）<br><a href="https://faq.kageki.hankyu.co.jp/faq/show/44?category_id=7&site_domain=default" target="_blank">宝塚歌劇：新人公演の公式FAQ</a>（入団7年目まで）<br><a href="https://kageki.hankyu.co.jp/fun/debut8.html" target="_blank">公式・108期初舞台</a>（2022年）<br><a href="https://ameblo.jp/yozora-ni-sakuhana/entry-12960382801.html" target="_blank">ユーザー指定の登場人物名簿</a><br><a href="https://www.moon-light.ne.jp/termi-nology/meaning/ochakai.htm" target="_blank">お茶会の慣習について</a></p></section>`}
function continueGame(){let s=saved();if(s&&s.term&&s.events){game=s;tab='timeline';render()}else alert('続きのデータが見つかりません。')}
function render(){const el=document.getElementById('app');el.innerHTML=!game?home():tab==='profile'?profileScreen():gameScreen()}
render();
</script></body></html>
