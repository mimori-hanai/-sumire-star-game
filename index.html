const START_SCENES=[
{phase:'入学試験',title:'第一次試験 ― 面接',intro:'春。大勢の受験生が宝塚音楽学校の門をくぐる。\n面接の扉の向こうでは、あなた自身の言葉と舞台人としての可能性が問われる。',fact:'公式の入学試験は、第一次＝面接、第二次＝面接・歌唱・舞踊、第三次＝面接。',choices:[

['落ち着いて質問を聞き、丁寧に答える','協調・芝居を伸ばす',{team:7,acting:6,energy:-1}],

{phase:'入学試験',title:'第二次試験 ― 歌唱と舞踊',intro:'歌唱と舞踊。限られた時間で、自分の魅力を届ける試験が続く。\n得意な表現を伸ばすか、苦手を補うか。今のあなたが選ぶ準備は？',fact:'公式募集要項では第二次試験で歌唱・舞踊が実施される。',choices:[

['表情、姿勢、歌、踊りを総合的に整える','すべてを少しずつ伸ばす',{song:5,dance:5,aura:4,energy:-3}]]},
{phase:'入学試験',title:'第三次試験 ― 最後の面接',intro:'最終面接。審査が終わると、桜の季節に向けて結果を待つことになる。\nここまで積み重ねてきた自分を、どのように示す？',fact:'実際の試験は、点数だけで自動判定されるものではない。本作の合否判定は創作。',event:'audition',choices:[

['同期になるかもしれない受験生への敬意も忘れない','協調・華を伸ばす',{team:8,aura:4,energy:1}]]},
{phase:'予科',title:'予科生 ― 基礎をつくる一年',intro:'音楽学校の予科生として、規則正しい授業が始まる。\nバレエ、声楽、日本舞踊、演劇。舞台の基本を身体に刻む毎日だ。',fact:'音楽学校の修学年限は予科1年・本科1年の計2年。',choices:[

{phase:'予科',title:'同期と向き合う稽古場',intro:'失敗を繰り返しながら、一つの舞台をともにつくる難しさを知る。\n自分を磨くだけでは、作品は完成しない。',fact:'音楽学校では演劇・合唱・ダンスなど、共同で取り組む授業がある。',choices:[

 if(type==='bau')base=.07;

   if(type==='tojo'){f.tojo++;label=role?'東上公演ヒロイン':'東上公演主演';}
   if(type==='tour'){f.tour++;label=role?'全国ツアー公演ヒロイン':'全国ツアー公演主演';}
   if(type==='rank'){f.rank++;label=role?'大劇場本公演の主要な娘役':'フィナーレでの大きな役割';}
   if(type==='top'){/* handled separately below */}
   if(type!=='top'){headline=label+'に抜擢';outcome='配役が発表され、あなたは「'+label+'」の機会を得た。\n役に向き合う時間は、次の舞台への財産になる。';updateLog(label,'研'+year+'で'+label+'の機会を得た。');sparkle='✦';}
  }else if(type!=='top'){
   headline='今回の配役は、別の形に';outcome=type==='rookie'?'新人公演の主役級は別の生徒が務めることになった。あなたにも役があり、稽古から学ぶことがある。':type==='rank'?'今回の公演では目立った番手上の変化はなかった。役に向き合い、周りを支える時間が続く。':'主役級の役は別の生徒へ。あなたは与えられた配役で、作品の完成度を高めていく。';state.stats.team=clamp(state.stats.team+3);
  }
  if(type==='top'){
    let yearOK=role?year>=5:year>=9;
    let rankScore=role?(f.rookie*.04+f.bau*.09+f.tojo*.14+f.tour*.09+f.goodRoles*.02):(f.rookie*.04+f.bau*.09+f.tojo*.15+f.tour*.09+f.rank*.13);
    let readiness=(totalSkill()-55)*.0045;
    let chance=(.055+rankScore+readiness+(aim==='embrace'?.08:aim==='steady'?.035:-.09))*(state.mode==='story'?1.08:.72);
    if(role&&year<=5)chance*=.38;
    else if(role&&year<=7)chance*=.72;
    if(!role&&year<=10)chance*=.20;
    else if(!role&&year<=12)chance*=.45;
    else if(!role&&year<=14)chance*=.70;
    if(!role&&f.rank===0)chance*=.45;
    if(role&&!(f.rookie||f.bau||f.tojo||f.tour))chance*=.45;
    if(state.stats.energy<20)chance*=.35;
    else if(state.stats.energy<35)chance*=.72;
    if(yearOK&&randPass(chance*.20)){
      state.top=true;state.topYear=year;state.ended='top';state.idx=SCENES.length;headline=state.troupe+' 次期'+stageName()+'に決定';outcome='劇団から、次期'+stageName()+'就任が正式に発表された。\n研'+year+'。これまで共演してきた仲間と、客席で見守ってくれた人たちへの思いが胸にあふれる。\nいよいよ、トップお披露目公演が始まる。';sparkle='✦';updateLog('トップ就任',state.troupe+'の'+stageName()+'に就任した。');
    }else{headline='新体制の発表';outcome='次期'+stageName()+'は、別の生徒に決定した。\n一人の舞台人として、次の作品で何を届けるか。その問いは続いていく。';}
  }
 }else{outcome='選んだ稽古を重ね、少しずつ表現を磨いた。';}
 // コマンド選択による疲労は次の時間の経過で少しずつ回復する。
 if(scene.phase.startsWith('研')&&state.stats.energy<85)state.stats.energy=clamp(state.stats.energy+3);
 state.log.push({year:year||0,label:scene.title,detail:label});
 makeResult(headline,outcome,chips,sparkle);
}
function startingStats(role,focus){let base={song:38,dance:38,acting:38,aura:38,team:42,energy:84};if(role==='娘役'){base.song+=3;base.acting+=3}else{base.dance+=3;base.aura+=3}if(focus==='song')base.song+=16;if(focus==='dance')base.dance+=16;if(focus==='acting')base.acting+=16;if(focus==='aura')base.aura+=16;return base}
function startGame(){let f=document.getElementById('newGame');if(!f)return;let data=new FormData(f),name=String(data.get('name')||'').trim().slice(0,18)||'すみれ';let role=data.get('role')==='娘役'?'娘役':'男役';let focus=['song','dance','acting','aura'].includes(data.get('focus'))?data.get('focus'):'acting';let mode=data.get('mode')==='strict'?'strict':'story';buildScenes(role);state={name,role,focus,mode,idx:0,attempt:0,troupe:'未定',stats:startingStats(role,focus),flags:{rookie:0,bau:0,tojo:0,tour:0,rank:0,goodRoles:0,transfers:0,debut:0},log:[],pending:null,top:false,topYear:null,ended:null,created:Date.now()};view='game';save();render()}
function continueGame(){state=getSaved();if(state){buildScenes(state.role);view='game';render()}else render()}
function next(){if(!state)return;state.pending=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let el=document.getElementById('app');if(view==='sources'){el.innerHTML=renderSources();return}if(view==='setup'){el.innerHTML=renderSetup();return}if(view==='game'&&state){el.innerHTML=renderGame();return}el.innerHTML=renderHome()}
function renderHome(){let s=getSaved();return `<section class="hero screen"><div class="hero-copy"><div class="eyebrow">FICTIONAL TAKARAZUKA CAREER SIMULATOR</div><h1 class="serif">すみれの<br><strong>軌跡</strong></h1><p class="muted" style="font-family:serif;letter-spacing:.18em">― 夢の大階段へ ―</p><p class="hero-desc">音楽学校の受験から、予科・本科、初舞台、組配属、新人公演へ。<br>バウホール、東上公演、組替え、そして次期トップ人事。<br>選択と巡り合わせで変わる、あなただけの舞台人生。</p><div class="btnrow"><button class="btn" data-action="setup">新しく物語を始める</button>${s?'<button class="btn secondary" data-action="continue">保存した続きから</button>':''}</div><p class="hero-note">配役・人事は実際と同様に選択だけで確定しません。公式情報をもとにした舞台制度と、架空の物語・抽選を組み合わせたゲームです。</p></div><div class="stage-art" aria-hidden="true"><div class="stage-glow"></div><div class="stage-arch"></div><div class="stage-floor"></div><div class="stage-steps"></div><div class="spot"></div><div class="spot"></div><div class="spot"></div><div class="spot"></div><div class="stage-center"><div class="big">✧</div><div class="small">YOUR DREAM STAGE</div></div><div class="stage-caption">いつか、この大階段の真ん中へ。</div></div></section><div class="info-strip"><span>男役／娘役の2ルート</span><span>花・月・雪・星・宙の5組</span><span>新人公演は研7まで</span><span>ローカル自動保存</span><span>複数の結末</span></div>`}
function renderSetup(){return `<section class="setup screen"><div class="eyebrow">CHAPTER ZERO / CHARACTER CREATION</div><h2 class="serif">あなたの舞台人生を、始めよう。</h2><p class="muted" style="font-size:13px">主人公・同期・出演作品のストーリーは架空です。制度や公演形態の考証は「資料・考証」を参照してください。</p><form id="newGame"><div class="field"><label for="starname">芸名（架空の名前を入力）</label><input id="starname" name="name" type="text" maxlength="18" placeholder="例：花乃宮 すみれ" autocomplete="off"></div><div class="field"><label>目指す道</label><div class="radio-grid"><label class="radio-card"><input type="radio" name="role" value="男役" checked><b>男役</b><span>目標：トップスター</span></label><label class="radio-card"><input type="radio" name="role" value="娘役"><b>娘役</b><span>目標：トップ娘役</span></label></div></div><div class="field"><label>得意な分野</label><div class="radio-grid"><label class="radio-card"><input type="radio" name="focus" value="song"><b>歌唱</b><span>音程・声・表現力</span></label><label class="radio-card"><input type="radio" name="focus" value="dance"><b>舞踊</b><span>バレエ・ダンス</span></label><label class="radio-card"><input type="radio" name="focus" value="acting" checked><b>芝居</b><span>人物の心を表現</span></label><label class="radio-card"><input type="radio" name="focus" value="aura"><b>華</b><span>舞台上の存在感</span></label></div></div><div class="field"><label>ゲームの難易度</label><div class="radio-grid"><label class="radio-card"><input type="radio" name="mode" value="story" checked><b>物語重視</b><span>抜擢の機会がやや多い</span></label><label class="radio-card"><input type="radio" name="mode" value="strict"><b>難関ルート</b><span>トップへの道はさらに険しい</span></label></div></div><p class="notice">配属先・組替え・トップ就任は自由選択ではなく、抽選と蓄積した舞台経験で結果が変わります。数値はすべてゲーム上の仕組みで、実際の劇団の評価・合格基準を示すものではありません。</p><div class="btnrow" style="margin-top:22px"><button type="submit" class="btn">第一次試験へ進む</button><button class="btn ghost" type="button" data-action="home">戻る</button></div></form></section>`}
function renderGame(){let s=state,scene=SCENES[s.idx];let total=Math.round((s.idx/SCENES.length)*100);let mobile=`<div class="mobile-stats"><span><b>${h(s.name)}</b> · ${h(s.role)}</span><span>${h(s.troupe)}</span><span>${scene?.year?'研'+scene.year:scene?.phase||'節目'}</span><button type="button" class="tinybtn" data-action="profile">詳細</button></div>`;let main='';if(s.pending)main=renderOutcome();else if(s.ended||!scene)main=renderEnd();else main=`<div class="scene-head"><span class="stage-tag">${h(scene.phase)}</span><span class="chapter">SCENE ${String(s.idx+1).padStart(2,'0')} / ${SCENES.length}</span></div>${mobile}<div class="progress"><div style="width:${total}%"></div></div><div class="scene-content screen"><div class="eyebrow">YOUR STORY · ${h(s.troupe==='未定'?'FIRST STEPS':s.troupe)}</div><h2>${h(scene.title)}</h2><p class="scene-story">${h(replaceRole(scene.intro))}</p>${scene.fact?`<p class="scene-quote"><b style="color:var(--gold)">考証メモ：</b>${h(scene.fact)}</p>`:''}<div class="choice-heading">あなたは、どう行動する？</div><div class="choices">${scene.choices.map((c,i)=>`<button type="button" class="choice" data-choice="${i}"><b>${h(c[0])}</b><small>${h(c[1])}</small></button>`).join('')}</div></div>`;return `<div class="game-grid screen"><section class="main-card">${main}</section><aside>${renderProfile()}${renderJournal()}</aside></div>`}
function replaceRole(text){return String(text).replaceAll('主役またはヒロイン',isGirl()?'ヒロイン':'主演').replaceAll('主演またはヒロイン',isGirl()?'ヒロイン':'主演').replaceAll('主役級',isGirl()?'ヒロイン級':'主演級')}
function renderProfile(){let s=state,f=s.flags,m=milestoneNames();let badges=[f.rookie,f.bau,f.tojo,f.tour];return `<div class="side-card"><div class="profile-top"><div class="avatar">✧</div><div><div class="profile-name">${h(s.name)}</div><div class="profile-meta">${h(s.role)} · ${h(s.troupe)}<br>${s.idx<3?'受験生':s.idx<7?'音楽学校生':SCENES[s.idx]?.year?'研究科'+SCENES[s.idx].year+'年':'舞台人'}</div></div></div><div class="side-heading">舞台力</div>${Object.entries(STAT_LABEL).map(([k,v])=>`<div class="stat-row"><span>${v}</span><div class="track"><div class="fill ${k==='energy'&&s.stats[k]<28?'low':''}" style="width:${s.stats[k]}%"></div></div><span class="stat-value">${s.stats[k]}</span></div>`).join('')}<div class="side-heading">主な舞台歴</div><div class="milestones">${m.map((x,i)=>`<div class="badge ${badges[i]?'got':''}">${h(x)}<br>${badges[i]?badges[i]+'回':'未経験'}</div>`).join('')}</div><div class="record"><span>本公演の抜擢</span><strong>${f.goodRoles}回</strong></div><div class="record"><span>${isGirl()?'主要な娘役':'番手につながる役付き'}</span><strong>${f.rank}回</strong></div><div class="record"><span>組替え</span><strong>${f.transfers}回</strong></div></div>`}
function renderJournal(){let recent=state.log.slice(-7).reverse();return `<div class="side-card"><div class="side-heading" style="margin-top:0">舞台日誌</div><div class="mini-journal">${recent.length?recent.map(x=>`<p><b>${x.year?'研'+x.year+' · ':''}${h(x.label)}</b><br>${h(x.detail||'稽古を重ねた。')}</p>`).join(''):'<p>あなたの物語は、ここから始まる。</p>'}</div></div><div class="side-card"><button type="button" class="tinybtn" style="width:100%" data-action="profile">全記録・能力を表示</button><p class="muted" style="font-size:10px;margin:10px 0 0">各選択後に自動保存。ブラウザのデータを削除すると記録も消えます。</p></div>`}
function renderOutcome(){let p=state.pending;return `<div class="outcome screen"><div class="eyebrow">THE NEXT PAGE OF YOUR STORY</div><div class="outcome-icon" aria-hidden="true">${h(p.flair)}</div><h2>${h(p.title)}</h2><p>${h(p.body)}</p><div class="changes">${p.chips.map(c=>`<span class="chip ${c.neg?'neg':''}">${h(c.text)}</span>`).join('')}</div><div style="margin-top:31px"><button class="btn" data-action="next">${state.ended?'舞台人生を振り返る':'次の章へ進む'}</button></div></div>`}
function endText(){let s=state,f=s.flags,n=s.name,target=stageName();if(s.ended==='audition')return {title:'挑戦の記録',sub:'夢に向かった季節',body:`${n}は音楽学校の入学試験へ挑んだ。合格には届かなかったが、歌と踊り、芝居に向き合った時間は残った。\n\n別の選択を重ねる、新しい物語を始めることができる。`};if(s.top)return {title:'トップ就任',sub:`${s.troupe} ${target}、誕生。`,body:`研${s.topYear}。${n}は${s.troupe}の${target}となった。\n\n新人公演${isGirl()?'ヒロイン':'主演'} ${f.rookie}回、バウホール${isGirl()?'ヒロイン':'主演'} ${f.bau}回、東上${isGirl()?'ヒロイン':'主演'} ${f.tojo}回。\n\nそして迎えるトップお披露目公演。大階段の中央に立つその姿に、音楽学校時代の自分が重なる。\n\nこれからは、トップとして座組を率い、作品を届けていく。`};let score=f.rookie+f.bau*2+f.tojo*3+f.tour*2+f.rank*2+f.goodRoles;let title=score>=10?'記憶に残るスター':'舞台を支えた表現者';let sub=score>=10?'主役とは異なる、あなたの輝き。':'すべての役には、物語がある。';return {title,sub,body:`${n}は${s.troupe}で舞台を重ねた。\n\n新人公演${isGirl()?'ヒロイン':'主演'} ${f.rookie}回、バウホール${isGirl()?'ヒロイン':'主演'} ${f.bau}回、東上${isGirl()?'ヒロイン':'主演'} ${f.tojo}回。\n\n${target}就任には届かなかった。しかし、一人の舞台人として客席に届けた時間があった。\n\n配役や組替え、仲間と過ごした舞台は、${n}だけのかけがえのない軌跡となった。`}}
function renderEnd(){let s=state,e=endText(),m=milestoneNames();return `<div class="finish-banner screen"><div class="crown" aria-hidden="true">✦</div><div class="eyebrow">FINAL CURTAIN</div><h1>${h(e.title)}</h1><p style="font-size:14px;letter-spacing:.1em;color:#f2dfda">${h(e.sub)}</p></div><div class="finish-body screen"><h3>EPILOGUE · ${h(s.name)} の物語</h3><p>${h(e.body)}</p><h3>舞台の歩み</h3><div class="milestones">${m.map((x,i)=>`<div class="badge ${[s.flags.rookie,s.flags.bau,s.flags.tojo,s.flags.tour][i]?'got':''}">${h(x)}<br>${[s.flags.rookie,s.flags.bau,s.flags.tojo,s.flags.tour][i]}回</div>`).join('')}</div><div class="ledger">${s.log.filter(x=>x.detail).map(x=>`<div>${x.year?'研'+x.year+' · ':''}<b>${h(x.label)}</b><br>${h(x.detail)}</div>`).join('')||'記録された舞台歴はありません。'}</div><div class="btnrow" style="margin-top:26px"><button class="btn" data-action="setup">別の人生を始める</button><button class="btn secondary" data-action="sources">資料・考証を読む</button></div></div>`}
function renderSources(){return `<section class="credits screen"><div class="eyebrow">NOTES / RESEARCH</div><h2>資料・考証</h2><p>このゲームは、実際の宝塚歌劇団の組制度・公演形態・学校制度を調べ、舞台人としての歩みを題材にした<strong>架空の育成シミュレーション</strong>です。ゲーム内の人物、配役、人事、合否、年数に応じた抜擢確率、能力値は創作です。ファンブログの推測や用語を公式決定・内部制度と混同しないよう区別しています。</p><h3>公式資料（制度・公演形態の根拠）</h3><ul><li><a href="https://www.tms.ac.jp/guidance/admissions.html" target="_blank" rel="noopener noreferrer">宝塚音楽学校：募集要項</a> — 予科1年・本科1年の修学年限。</li><li><a href="https://www.tms.ac.jp/guidance/examination.html" target="_blank" rel="noopener noreferrer">宝塚音楽学校：入学試験</a> — 第一次〜第三次試験の内容。</li><li><a href="https://www.tms.ac.jp/school_life/curriculum.html" target="_blank" rel="noopener noreferrer">宝塚音楽学校：カリキュラム</a> — 声楽、バレエ、演劇、日本舞踊など。</li><li><a href="https://www.tms.ac.jp/school_life/school_life.html" target="_blank" rel="noopener noreferrer">宝塚音楽学校：年間スケジュール</a> — 文化祭、卒業、初舞台。</li><li><a href="https://kageki.hankyu.co.jp/beginner/5min.html" target="_blank" rel="noopener noreferrer">宝塚歌劇：初心者ガイド</a> — 五組と専科、トップスターとトップ娘役。</li><li><a href="https://faq.kageki.hankyu.co.jp/faq/show/44?category_id=7&site_domain=default" target="_blank" rel="noopener noreferrer">宝塚歌劇：新人公演について（公式FAQ）</a> — 入団7年目まで。</li><li><a href="https://kageki.hankyu.co.jp/news/20260618_003.html" target="_blank" rel="noopener noreferrer">宝塚歌劇：第112期初舞台生の組回り</a> — 2026年の班編成と組配属予定。</li><li><a href="https://kageki.hankyu.co.jp/news/20260518_001.html" target="_blank" rel="noopener noreferrer">宝塚歌劇：鳳月杏の舞台歴</a> — 組替え、バウホール主演、トップ就任等の具体例。</li><li><a href="https://kageki.hankyu.co.jp/news/20260518_002.html" target="_blank" rel="noopener noreferrer">宝塚歌劇：天紫珠李の舞台歴</a> — 新公ヒロイン、バウ公演、男役から娘役への転向の具体例。</li></ul><h3>ファンによる分析・考察（公式な昇格基準ではない）</h3><ul><li><a href="https://note.com/takarazuka_db/n/n87f10124cd23" target="_blank" rel="noopener noreferrer">宝塚fanDB：トップ娘役はどうやって決まるの？</a> — 明文化されたトップ就任ルートはないと整理。</li><li><a href="https://takarazuka.blog/2025/08/13/doukisakusen/" target="_blank" rel="noopener noreferrer">くららのビバ宝塚！：同期２人人事</a> — 新人公演、バウ、東上、全国ツアーの経歴を比較。</li><li><a href="https://takarazuka-life.com/takarazuka-topmusumeyaku-heroine-history/" target="_blank" rel="noopener noreferrer">新・宝塚は生きる糧：トップ娘役就任前のヒロイン歴</a> — 抜擢歴とトップ就任が必ずしも一致しない事例。</li><li><a href="https://note.com/mami_k/n/n50371cc14b66" target="_blank" rel="noopener noreferrer">まろん：各組学年分布（2026年11月）</a> — 「番手」は観察による非公式な整理と明記。</li></ul><h3>創作上の主な簡略化</h3><p>①実際には配属・抜擢・人事が能力数値で機械的に決まることはありません。②文化祭・初舞台・組回りの時期と方式は期によって異なります。③「新人公演主演→バウ主演→東上主演→トップ」などはファンが語る代表的な歩みで、必須条件ではありません。④娘役には男役と同一の明確な番手制度を当てはめていません。⑤本作では受験、組配属、組替え、退団・就任の時期をゲーム向けに圧縮しています。</p><div class="notice">写真・音源・歌詞・衣装・公式ロゴ・実在生徒の肖像は使用していません。実際の配役、トップ人事の予想を目的としたゲームではありません。</div><div class="btnrow" style="margin-top:20px"><button class="btn secondary" data-action="${state?'game':'home'}">${state?'ゲームに戻る':'タイトルに戻る'}</button></div></section>`}
function showProfile(){if(!state)return;let s=state;let page=`<section class="credits screen"><div class="eyebrow">STAR PROFILE</div><h2>${h(s.name)}の記録</h2><p>${h(s.role)} · ${h(s.troupe)} · ${h(stageName())}を目指す物語</p>${renderProfile()}<h3>活動日誌</h3><div class="ledger">${s.log.map(x=>`<div>${x.year?'研'+x.year+' · ':''}<b>${h(x.label)}</b>${x.detail?'<br>'+h(x.detail):''}</div>`).join('')}</div><div class="btnrow" style="margin-top:24px"><button class="btn" data-action="game">ゲームへ戻る</button></div></section>`;document.getElementById('app').innerHTML=page}
function confirmSetup(){if(state&&!state.ended&&state.idx>0){if(!confirm('新しい物語を始めますか？ 現在のセーブデータは新しいゲーム開始時に上書きされます。'))return}view='setup';render()}
document.addEventListener('click',function(ev){let ch=ev.target.closest('[data-choice]');if(ch){choose(Number(ch.dataset.choice));return}let target=ev.target.closest('[data-action]');if(!target)return;let a=target.dataset.action;if(a==='setup'){confirmSetup()}else if(a==='continue'){continueGame()}else if(a==='home'){view='home';render()}else if(a==='sources'){view='sources';render()}else if(a==='game'){view='game';render()}else if(a==='next'){next()}else if(a==='profile'){showProfile()}window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('newGame');document.addEventListener('submit',function(ev){if(ev.target.id==='newGame'){ev.preventDefault();startGame()}});
document.getElementById('homeBtn').addEventListener('click',()=>{view='home';render()});document.getElementById('sourcesBtn').addEventListener('click',()=>{view='sources';render()});
render();
</script>
</body>
